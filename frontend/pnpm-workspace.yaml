  '@swc/core': true
  esbuild: true
  msw: true
  protobufjs: false
  sharp: true

minimumReleaseAgeExclude:
  - '@mantine/core@9.7.1'
  - '@mantine/dates@9.7.1'
  - '@mantine/form@9.7.1'
  - '@mantine/hooks@9.7.1'
  - '@mantine/notifications@9.7.1'
  - '@mantine/schedule@9.7.1'
  - '@mantine/store@9.7.1'
