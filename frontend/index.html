<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tribly - Cycling Team Management</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Tribly - Cycling Team Management" />
    <meta name="description" content="Organize your cycling team with Tribly. Plan rides, share routes with GPX support, and keep your club connected." />
    <meta name="keywords" content="cycling, team, club, rides, routes, GPX, bike" />
    <meta name="author" content="Tribly" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#228be6" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tribly - Cycling Team Management" />
    <meta property="og:description" content="Organize your cycling team with Tribly. Plan rides, share routes with GPX support, and keep your club connected." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tribly - Cycling Team Management" />
    <meta name="twitter:description" content="Organize your cycling team with Tribly. Plan rides, share routes with GPX support, and keep your club connected." />
    <meta name="twitter:image" content="/og-image.png" />
    <script>
      // Mantine color scheme script to prevent FOUC (flash of unstyled content)
      (function() {
        try {
          var colorScheme = localStorage.getItem('mantine-color-scheme-value');
          if (colorScheme === 'dark' || (!colorScheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-mantine-color-scheme', 'dark');
            document.documentElement.setAttribute('data-color-scheme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
