server {
	listen 80 default_server;

	gzip on;
	gzip_min_length 1000;
	gzip_types text/plain text/xml application/javascript text/css;

	root /app;

	# apple-app-site-association must be served as JSON
	location = /.well-known/apple-app-site-association {
		default_type application/json;
		try_files $uri =404;
	}

	# hashed build assets
	location ^~ /assets/ {
		add_header Cache-Control "public, max-age=2678400, immutable";
		try_files $uri =404;
	}

	# static files at the root (icons, robots.txt, ...)
	location ~* ^/[^/]+\.(?:png|jpe?g|gif|webp|avif|svg|ico|txt|xml|json|webmanifest)$ {
		add_header Cache-Control "public, max-age=2678400";
		try_files $uri =404;
	}

	# normal routes
	# serve given url and default to index.html if not found
	# a route segment may contain a dot (team slug "yann.h"), so never 404 on one
	location / {
		add_header Cache-Control "no-store";
		try_files $uri /index.html;
	}
}
