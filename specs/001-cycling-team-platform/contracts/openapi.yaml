openapi: 3.1.0
info:
  title: Tribly - Cycling Team Management API
  description: |
    API for the Tribly cycling team management platform.
    Supports multi-tenancy via custom domains, OAuth2 authentication,
    and comprehensive team, ride, trip, and route management.
  version: 1.0.0
  contact:
    name: Tribly Team
  license:
    name: Proprietary

servers:
  - url: https://api.tribly.app/v1
    description: Production server
  - url: http://localhost:8080/v1
    description: Local development

tags:
  - name: Auth
    description: Authentication and authorization
  - name: Users
    description: User profile management
  - name: Teams
    description: Team management
  - name: Rides
    description: Ride event management
  - name: Trips
    description: Multi-day trip management
  - name: Routes
    description: Route and GPX management
  - name: Places
    description: Location management
  - name: Messages
    description: Team messaging
  - name: Notifications
    description: User notifications
  - name: Admin
    description: Administrative operations

security:
  - BearerAuth: []

paths:
  # ============== AUTH ==============
  /auth/oauth/{provider}:
    get:
      operationId: initiateOAuth
      summary: Initiate OAuth flow
      tags: [Auth]
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [strava, google, facebook]
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to OAuth provider

  /auth/oauth/{provider}/callback:
    get:
      operationId: handleOAuthCallback
      summary: Handle OAuth callback
      tags: [Auth]
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [strava, google, facebook]
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Refresh access token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      operationId: logout
      summary: Logout current session
      tags: [Auth]
      responses:
        '204':
          description: Logged out successfully

  # ============== USERS ==============
  /users/me:
    get:
      operationId: getCurrentUser
      summary: Get current user profile
      tags: [Users]
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateCurrentUser
      summary: Update current user profile
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/me/teams:
    get:
      operationId: getCurrentUserTeams
      summary: Get teams for current user
      tags: [Users]
      responses:
        '200':
          description: User's teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamMembership'

  # ============== TEAMS ==============
  /teams:
    get:
      operationId: listTeams
      summary: List public teams (catalog)
      tags: [Teams]
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of public teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamListResponse'
    post:
      operationId: createTeam
      summary: Create a new team
      tags: [Teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreate'
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'

  /teams/{teamId}:
    get:
      operationId: getTeam
      summary: Get team details
      tags: [Teams]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
      responses:
        '200':
          description: Team details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTeam
      summary: Update team details
      tags: [Teams]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdate'
      responses:
        '200':
          description: Team updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: deleteTeam
      summary: Delete team (soft delete)
      tags: [Teams]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
      responses:
        '204':
          description: Team deleted
        '403':
          $ref: '#/components/responses/Forbidden'

  /teams/{teamId}/members:
    get:
      operationId: listTeamMembers
      summary: List team members
      tags: [Teams]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Team members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberListResponse'
    post:
      operationId: inviteTeamMember
      summary: Invite user to team
      tags: [Teams]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInvite'
      responses:
        '201':
          description: Invitation sent
        '400':
          $ref: '#/components/responses/BadRequest'

  /teams/{teamId}/members/{userId}:
    patch:
      operationId: updateTeamMember
      summary: Update member role
      tags: [Teams]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/TeamRole'
      responses:
        '200':
          description: Member updated
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: removeTeamMember
      summary: Remove member from team
      tags: [Teams]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Member removed
        '403':
          $ref: '#/components/responses/Forbidden'

  /teams/{teamId}/domains:
    get:
      operationId: listTeamDomains
      summary: List team custom domains
      tags: [Teams]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
      responses:
        '200':
          description: Team domains
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamDomain'
    post:
      operationId: addTeamDomain
      summary: Add custom domain to team
      tags: [Teams]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  format: hostname
      responses:
        '201':
          description: Domain added (pending verification)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDomain'

  # ============== RIDES ==============
  /teams/{teamId}/rides:
    get:
      operationId: listRides
      summary: List team rides
      tags: [Rides]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RideStatus'
      responses:
        '200':
          description: List of rides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideListResponse'
    post:
      operationId: createRide
      summary: Create a new ride
      tags: [Rides]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideCreate'
      responses:
        '201':
          description: Ride created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '400':
          $ref: '#/components/responses/BadRequest'

  /teams/{teamId}/rides/{rideId}:
    get:
      operationId: getRide
      summary: Get ride details
      tags: [Rides]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/RideIdParam'
      responses:
        '200':
          description: Ride details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateRide
      summary: Update ride
      tags: [Rides]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/RideIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideUpdate'
      responses:
        '200':
          description: Ride updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
    delete:
      operationId: deleteRide
      summary: Delete ride
      tags: [Rides]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/RideIdParam'
      responses:
        '204':
          description: Ride deleted

  /teams/{teamId}/rides/{rideId}/groups:
    get:
      operationId: listRideGroups
      summary: List ride groups
      tags: [Rides]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/RideIdParam'
      responses:
        '200':
          description: Ride groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RideGroup'
    post:
      operationId: createRideGroup
      summary: Create ride group
      tags: [Rides]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/RideIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideGroupCreate'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideGroup'

  /teams/{teamId}/rides/{rideId}/groups/{groupId}/join:
    post:
      operationId: joinRideGroup
      summary: Join a ride group
      tags: [Rides]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/RideIdParam'
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        '201':
          description: Joined ride group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideParticipation'
        '409':
          description: Already registered or group full

  /teams/{teamId}/rides/{rideId}/groups/{groupId}/leave:
    post:
      operationId: leaveRideGroup
      summary: Leave a ride group
      tags: [Rides]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/RideIdParam'
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Left ride group

  # ============== TRIPS ==============
  /teams/{teamId}/trips:
    get:
      operationId: listTrips
      summary: List team trips
      tags: [Trips]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TripStatus'
      responses:
        '200':
          description: List of trips
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListResponse'
    post:
      operationId: createTrip
      summary: Create a new trip
      tags: [Trips]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '201':
          description: Trip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'

  /teams/{teamId}/trips/{tripId}:
    get:
      operationId: getTrip
      summary: Get trip details
      tags: [Trips]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/TripIdParam'
      responses:
        '200':
          description: Trip details with days
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetail'
    patch:
      operationId: updateTrip
      summary: Update trip
      tags: [Trips]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/TripIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripUpdate'
      responses:
        '200':
          description: Trip updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
    delete:
      operationId: deleteTrip
      summary: Delete trip
      tags: [Trips]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/TripIdParam'
      responses:
        '204':
          description: Trip deleted

  /teams/{teamId}/trips/{tripId}/join:
    post:
      operationId: joinTrip
      summary: Register for a trip
      tags: [Trips]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/TripIdParam'
      responses:
        '201':
          description: Registered for trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripParticipation'

  # ============== ROUTES ==============
  /teams/{teamId}/routes:
    get:
      operationId: listRoutes
      summary: List team routes
      tags: [Routes]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: difficulty
          in: query
          schema:
            $ref: '#/components/schemas/RouteDifficulty'
        - name: surfaceType
          in: query
          schema:
            $ref: '#/components/schemas/SurfaceType'
        - name: minDistance
          in: query
          schema:
            type: integer
        - name: maxDistance
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of routes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteListResponse'
    post:
      operationId: createRoute
      summary: Create a new route
      tags: [Routes]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteCreate'
      responses:
        '201':
          description: Route created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'

  /teams/{teamId}/routes/{routeId}:
    get:
      operationId: getRoute
      summary: Get route details
      tags: [Routes]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/RouteIdParam'
      responses:
        '200':
          description: Route details with GPX tracks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDetail'
    patch:
      operationId: updateRoute
      summary: Update route
      tags: [Routes]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/RouteIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteUpdate'
      responses:
        '200':
          description: Route updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
    delete:
      operationId: deleteRoute
      summary: Delete route
      tags: [Routes]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/RouteIdParam'
      responses:
        '204':
          description: Route deleted

  /teams/{teamId}/routes/{routeId}/gpx:
    post:
      operationId: uploadGpx
      summary: Upload GPX file for route
      tags: [Routes]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/RouteIdParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: GPX processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpxTrack'
        '400':
          description: Invalid GPX file
    get:
      operationId: downloadGpx
      summary: Download route as GPX
      tags: [Routes]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/RouteIdParam'
      responses:
        '200':
          description: GPX file
          content:
            application/gpx+xml:
              schema:
                type: string
                format: binary

  /teams/{teamId}/routes/{routeId}/fit:
    get:
      operationId: downloadFit
      summary: Download route as FIT (Garmin)
      tags: [Routes]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/RouteIdParam'
      responses:
        '200':
          description: FIT file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ============== PLACES ==============
  /teams/{teamId}/places:
    get:
      operationId: listPlaces
      summary: List team places
      tags: [Places]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/PlaceType'
        - name: near
          in: query
          description: "lat,lng format"
          schema:
            type: string
        - name: radius
          in: query
          description: Radius in meters
          schema:
            type: integer
            default: 10000
      responses:
        '200':
          description: List of places
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceListResponse'
    post:
      operationId: createPlace
      summary: Create a new place
      tags: [Places]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceCreate'
      responses:
        '201':
          description: Place created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'

  /teams/{teamId}/places/{placeId}:
    get:
      operationId: getPlace
      summary: Get place details
      tags: [Places]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - name: placeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Place details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
    patch:
      operationId: updatePlace
      summary: Update place
      tags: [Places]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - name: placeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceUpdate'
      responses:
        '200':
          description: Place updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
    delete:
      operationId: deletePlace
      summary: Delete place
      tags: [Places]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - name: placeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Place deleted

  # ============== MESSAGES ==============
  /teams/{teamId}/messages/threads:
    get:
      operationId: listMessageThreads
      summary: List message threads
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/MessageThreadType'
      responses:
        '200':
          description: Message threads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageThreadListResponse'

  /teams/{teamId}/messages/threads/{threadId}:
    get:
      operationId: getMessageThread
      summary: Get thread with messages
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - name: threadId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Thread with messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageThreadDetail'

  /teams/{teamId}/messages/threads/{threadId}/messages:
    post:
      operationId: postMessage
      summary: Post message to thread
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/TeamIdParam'
        - name: threadId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
      responses:
        '201':
          description: Message posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  # ============== NOTIFICATIONS ==============
  /notifications:
    get:
      operationId: listNotifications
      summary: List user notifications
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: User notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'

  /notifications/mark-read:
    post:
      operationId: markNotificationsRead
      summary: Mark notifications as read
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                all:
                  type: boolean
      responses:
        '204':
          description: Notifications marked as read

  # ============== PUBLIC CATALOG ==============
  /catalog/teams:
    get:
      operationId: listPublicTeams
      summary: Browse public teams
      tags: [Teams]
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Public teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamListResponse'

  /catalog/routes:
    get:
      operationId: listPublicRoutes
      summary: Browse public routes
      tags: [Routes]
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: near
          in: query
          schema:
            type: string
        - name: radius
          in: query
          schema:
            type: integer
        - name: difficulty
          in: query
          schema:
            $ref: '#/components/schemas/RouteDifficulty'
      responses:
        '200':
          description: Public routes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteListResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TeamIdParam:
      name: teamId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RideIdParam:
      name: rideId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TripIdParam:
      name: tripId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RouteIdParam:
      name: routeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ===== Common =====
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    # ===== Auth =====
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        user:
          $ref: '#/components/schemas/User'

    # ===== Users =====
    User:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
        locale:
          type: string
        timezone:
          type: string
        stravaConnected:
          type: boolean
        garminConnected:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 100
        avatarUrl:
          type: string
          format: uri
        locale:
          type: string
        timezone:
          type: string

    # ===== Teams =====
    Team:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        logoUrl:
          type: string
          format: uri
        coverImageUrl:
          type: string
          format: uri
        isPublic:
          type: boolean
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    TeamCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        isPublic:
          type: boolean
          default: false

    TeamUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        logoUrl:
          type: string
          format: uri
        coverImageUrl:
          type: string
          format: uri
        isPublic:
          type: boolean

    TeamListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Team'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    TeamRole:
      type: string
      enum: [ADMIN, ORGANIZER, MEMBER]

    TeamMembership:
      type: object
      properties:
        team:
          $ref: '#/components/schemas/Team'
        role:
          $ref: '#/components/schemas/TeamRole'
        joinedAt:
          type: string
          format: date-time

    TeamMember:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        role:
          $ref: '#/components/schemas/TeamRole'
        joinedAt:
          type: string
          format: date-time

    TeamMemberListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    TeamInvite:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/TeamRole'

    TeamDomain:
      type: object
      properties:
        id:
          type: integer
          format: int64
        domain:
          type: string
        verified:
          type: boolean
        verificationToken:
          type: string
        isPrimary:
          type: boolean

    # ===== Rides =====
    RideStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CANCELLED]

    Visibility:
      type: string
      enum: [TEAM, PUBLIC]

    Ride:
      type: object
      required: [id, title, date, status]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        status:
          $ref: '#/components/schemas/RideStatus'
        visibility:
          $ref: '#/components/schemas/Visibility'
        routeId:
          type: integer
          format: int64
        meetingPointId:
          type: integer
          format: int64
        participantCount:
          type: integer
        groupCount:
          type: integer
        createdBy:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time

    RideDetail:
      allOf:
        - $ref: '#/components/schemas/Ride'
        - type: object
          properties:
            route:
              $ref: '#/components/schemas/Route'
            meetingPoint:
              $ref: '#/components/schemas/Place'
            groups:
              type: array
              items:
                $ref: '#/components/schemas/RideGroupWithParticipants'

    RideCreate:
      type: object
      required: [title, date]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        routeId:
          type: integer
          format: int64
        meetingPointId:
          type: integer
          format: int64
        visibility:
          $ref: '#/components/schemas/Visibility'
        recurrenceRule:
          type: string
        groups:
          type: array
          items:
            $ref: '#/components/schemas/RideGroupCreate'

    RideUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        routeId:
          type: integer
          format: int64
        meetingPointId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/RideStatus'
        visibility:
          $ref: '#/components/schemas/Visibility'

    RideListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Ride'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    RideGroup:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        routeId:
          type: integer
          format: int64
        averageSpeed:
          type: integer
        maxParticipants:
          type: integer
        currentParticipants:
          type: integer
        sortOrder:
          type: integer

    RideGroupWithParticipants:
      allOf:
        - $ref: '#/components/schemas/RideGroup'
        - type: object
          properties:
            participants:
              type: array
              items:
                $ref: '#/components/schemas/RideParticipation'

    RideGroupCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        routeId:
          type: integer
          format: int64
        averageSpeed:
          type: integer
          minimum: 10
          maximum: 50
        maxParticipants:
          type: integer
          minimum: 1

    RideParticipation:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/User'
        status:
          type: string
          enum: [REGISTERED, CONFIRMED, CANCELLED, COMPLETED]
        registeredAt:
          type: string
          format: date-time
        notes:
          type: string

    # ===== Trips =====
    TripStatus:
      type: string
      enum: [PLANNING, PUBLISHED, IN_PROGRESS, COMPLETED, CANCELLED]

    Trip:
      type: object
      required: [id, title, startDate, endDate, status]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/TripStatus'
        visibility:
          $ref: '#/components/schemas/Visibility'
        coverImageUrl:
          type: string
          format: uri
        maxParticipants:
          type: integer
        participantCount:
          type: integer
        dayCount:
          type: integer
        createdBy:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time

    TripDetail:
      allOf:
        - $ref: '#/components/schemas/Trip'
        - type: object
          properties:
            days:
              type: array
              items:
                $ref: '#/components/schemas/TripDay'
            participants:
              type: array
              items:
                $ref: '#/components/schemas/TripParticipation'

    TripCreate:
      type: object
      required: [title, startDate, endDate]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        visibility:
          $ref: '#/components/schemas/Visibility'
        coverImageUrl:
          type: string
          format: uri
        maxParticipants:
          type: integer
          minimum: 1

    TripUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/TripStatus'
        visibility:
          $ref: '#/components/schemas/Visibility'
        coverImageUrl:
          type: string
          format: uri
        maxParticipants:
          type: integer
          minimum: 1

    TripListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    TripDay:
      type: object
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        title:
          type: string
        description:
          type: string
        accommodation:
          $ref: '#/components/schemas/Place'
        rides:
          type: array
          items:
            $ref: '#/components/schemas/Ride'
        sortOrder:
          type: integer

    TripParticipation:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/User'
        status:
          type: string
          enum: [INTERESTED, REGISTERED, CONFIRMED, CANCELLED]
        registeredAt:
          type: string
          format: date-time

    # ===== Routes =====
    RouteDifficulty:
      type: string
      enum: [EASY, MODERATE, HARD, EXPERT]

    SurfaceType:
      type: string
      enum: [ROAD, GRAVEL, MTB, MIXED]

    Route:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        distance:
          type: integer
          description: Distance in meters
        elevationGain:
          type: integer
          description: Elevation gain in meters
        elevationLoss:
          type: integer
          description: Elevation loss in meters
        difficulty:
          $ref: '#/components/schemas/RouteDifficulty'
        surfaceType:
          $ref: '#/components/schemas/SurfaceType'
        isPublic:
          type: boolean
        thumbnailUrl:
          type: string
          format: uri
        startPoint:
          $ref: '#/components/schemas/GeoPoint'
        endPoint:
          $ref: '#/components/schemas/GeoPoint'
        createdBy:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time

    RouteDetail:
      allOf:
        - $ref: '#/components/schemas/Route'
        - type: object
          properties:
            tracks:
              type: array
              items:
                $ref: '#/components/schemas/GpxTrack'
            climbs:
              type: array
              items:
                $ref: '#/components/schemas/RouteClimb'
            pointsOfInterest:
              type: array
              items:
                $ref: '#/components/schemas/RoutePointOfInterest'

    RouteCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        difficulty:
          $ref: '#/components/schemas/RouteDifficulty'
        surfaceType:
          $ref: '#/components/schemas/SurfaceType'
        isPublic:
          type: boolean
          default: false

    RouteUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        difficulty:
          $ref: '#/components/schemas/RouteDifficulty'
        surfaceType:
          $ref: '#/components/schemas/SurfaceType'
        isPublic:
          type: boolean

    RouteListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    GpxTrack:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        originalFileName:
          type: string
        trackPoints:
          type: array
          items:
            $ref: '#/components/schemas/TrackPoint'
        processedAt:
          type: string
          format: date-time

    TrackPoint:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        ele:
          type: number
          format: double
        time:
          type: string
          format: date-time

    RouteClimb:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        startDistance:
          type: integer
        endDistance:
          type: integer
        elevationGain:
          type: integer
        averageGradient:
          type: number
          format: double
        maxGradient:
          type: number
          format: double
        category:
          type: string
          enum: [HC, CAT1, CAT2, CAT3, CAT4]

    RoutePointOfInterest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
          enum: [CAFE, WATER, VIEWPOINT, DANGER, INFO]
        distance:
          type: integer
        location:
          $ref: '#/components/schemas/GeoPoint'
        notes:
          type: string

    GeoPoint:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double

    # ===== Places =====
    PlaceType:
      type: string
      enum: [MEETUP, CAFE, RESTAURANT, HOTEL, CAMPSITE, WATER, OTHER]

    Place:
      type: object
      required: [id, name, type, lat, lng]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          $ref: '#/components/schemas/PlaceType'
        address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        phone:
          type: string
        website:
          type: string
          format: uri
        notes:
          type: string
        isPublic:
          type: boolean
        createdBy:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time

    PlaceCreate:
      type: object
      required: [name, type, lat, lng]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        type:
          $ref: '#/components/schemas/PlaceType'
        address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        phone:
          type: string
        website:
          type: string
          format: uri
        notes:
          type: string
        isPublic:
          type: boolean
          default: false

    PlaceUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        type:
          $ref: '#/components/schemas/PlaceType'
        address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        phone:
          type: string
        website:
          type: string
          format: uri
        notes:
          type: string
        isPublic:
          type: boolean

    PlaceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Place'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ===== Messages =====
    MessageThreadType:
      type: string
      enum: [TEAM, RIDE, TRIP, DIRECT]

    MessageThread:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/MessageThreadType'
        title:
          type: string
        rideId:
          type: integer
          format: int64
        tripId:
          type: integer
          format: int64
        lastMessageAt:
          type: string
          format: date-time
        unreadCount:
          type: integer

    MessageThreadDetail:
      allOf:
        - $ref: '#/components/schemas/MessageThread'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'
            meta:
              $ref: '#/components/schemas/PaginationMeta'

    MessageThreadListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MessageThread'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    Message:
      type: object
      properties:
        id:
          type: integer
          format: int64
        author:
          $ref: '#/components/schemas/User'
        content:
          type: string
        parentId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time

    MessageCreate:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 10000
        parentId:
          type: integer
          format: int64

    # ===== Notifications =====
    Notification:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        title:
          type: string
        body:
          type: string
        data:
          type: object
        readAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time

    NotificationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        unreadCount:
          type: integer
