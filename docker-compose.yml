services:
  # Reverse proxy
  traefik:
    image: traefik:3.6
    container_name: tribly-traefik
    restart: unless-stopped
    networks:
      - tribly
    ports:
      - "${HTTP_PORT:-8090}:80"
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      - "--log.level=WARN"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--providers.docker.constraints=Label(`traefik.stack`,`${TRAEFIK_STACK}`)"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=false"

  backend:
    image: ghcr.io/glandais/tribly-backend:latest
    container_name: tribly-backend
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    networks:
      - tribly
    env_file:
      - .env
    volumes:
      - ./data/storage:/mnt/storage
      - ./data/keys:/mnt/keys:ro
    labels:
      - "traefik.enable=true"
      - "traefik.stack=${TRAEFIK_STACK}"
      - "traefik.http.routers.quarkus.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.quarkus.priority=100"
      - "traefik.http.services.quarkus.loadbalancer.server.port=8080"

  frontend:
    image: ghcr.io/glandais/tribly-frontend:latest
    container_name: tribly-frontend
    restart: unless-stopped
    networks:
      - tribly
    labels:
      - "traefik.enable=true"
      - "traefik.stack=${TRAEFIK_STACK}"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.frontend.priority=1"

  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: tribly-postgres
    restart: unless-stopped
    networks:
      - tribly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v3.30.1
    container_name: tribly-imgproxy
    restart: unless-stopped
    networks:
      - tribly
    depends_on:
      - minio
    environment:
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AUTO_AVIF: "true"
      IMGPROXY_AUTO_JXL: "true"
      IMGPROXY_QUALITY: "85"
      IMGPROXY_MAX_SRC_RESOLUTION: "50000000"
      IMGPROXY_MAX_ANIMATION_FRAMES: "100"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_USE_S3: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1

  varnish:
    image: varnish:6.0.14
    container_name: tribly-varnish
    restart: unless-stopped
    networks:
      - tribly
    volumes:
      - "./services/varnish/varnish.vcl:/etc/varnish/default.vcl"
    tmpfs:
      - /var/lib/varnish:exec
    environment:
      - VARNISH_SIZE=20G
    command: "-p default_ttl=86400"

  brouter:
    build: ./services/brouter
    container_name: tribly-brouter
    restart: unless-stopped
    networks:
      - tribly
    volumes:
      - ./data/segments4:/opt/brouter/segments4:ro
    environment:
      BROUTER_THREADS: "8"

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: tribly-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - tribly
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  tileserver:
    image: maptiler/tileserver-gl:v4.13.1
    container_name: tribly-tileserver
    restart: unless-stopped
    networks:
      - tribly
    volumes:
      - ./data/tileserver:/data

volumes:
  postgres_data:
  minio_data:

networks:
  tribly:
