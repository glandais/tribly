# The deployment file. Two tools read it, and it has to stay valid for both:
#
#   - `docker stack deploy`, on a deployed host (Swarm) — always through scripts/deploy.sh, which
#     loads .env first: unlike compose, `docker stack deploy` reads no .env of its own, so every
#     ${VAR} below would silently expand to nothing.
#   - `docker compose`, on a workstation, layered with docker-compose.local.yml (see its header).
#
# Where the two disagree, this file carries both spellings. Swarm ignores `container_name`,
# `restart`, `depends_on` and `tmpfs` (it warns about the first two and says nothing about the
# others), and reads the Traefik routing labels from `deploy.labels`; compose reads them from
# `labels`. `profiles` and a top-level `name` are the opposite case: they make `docker stack deploy`
# fail outright, so neither may appear here.
services:
  # Reverse proxy
  traefik:
    image: traefik:v3.7
    container_name: ${ENV_NAME}-traefik
    restart: unless-stopped
    networks:
      - pedalons
    ports:
      # Le TLS est termine par Caddy sur l'hote, qui seul doit joindre ce port. Swarm ne sait pas
      # publier sur le loopback : il ignore une IP `127.0.0.1:` (avec un simple avertissement) et
      # ecoute sur toutes les interfaces. La restriction passe donc par une regle DOCKER-USER sur
      # l'hote -- ufw ne sert a rien, Docker insere ses regles avant les siennes. Voir la section
      # Deployment du README. docker-compose.local.yml remet le loopback sur un poste.
      - "${HTTP_PORT:-8090}:80"
    # Le provider Swarm lit les `deploy.labels` des *services* ; docker-compose.local.yml remplace
    # cette commande par la meme avec le provider Docker, qui lit les `labels` des conteneurs.
    command:
      - "--api.dashboard=false"
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      - "--log.level=WARN"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--providers.swarm.constraints=Label(`traefik.stack`,`${ENV_NAME}`)"
      # backend est attache a deux reseaux : sans ce reglage le provider choisit une IP au hasard
      # entre les deux, et une IP `pedalons-shared` -- que traefik ne joint pas -- donne des 502
      # sur /api.
      - "--providers.swarm.network=${ENV_NAME}-net"
      # Par defaut 15 s : pendant un rolling update, autant de temps a router vers une tache deja
      # arretee. Le health check des services (labels plus bas) couvre le reste.
      - "--providers.swarm.refreshSeconds=5"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      # Only a manager answers the Swarm API over the socket above.
      placement:
        constraints:
          - node.role == manager

  backend:
    # BACKEND_IMAGE_SUFFIX is "-<commit>", set by scripts/deploy.sh (see scripts/_image_tag.sh).
    # Unset on a workstation, which runs the latest build under the alias :${ENV_NAME}.
    image: pedalons-backend:${ENV_NAME}${BACKEND_IMAGE_SUFFIX:-}
    container_name: ${ENV_NAME}-backend
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    networks:
      - pedalons
      # valhalla + tileserver vivent dans la stack pedalons-shared (docker-compose.shared.yml).
      - shared
    # `docker stack deploy` honours env_file too: .env is read at deploy time, and a changed value
    # rolls the service on the next deploy.
    env_file:
      - .env
    environment:
      ERROR_LOG_DETAILS: "false"
      # Restated from .env with :? so a missing value stops the deploy instead of booting a broken
      # Domain.
      PEDALONS_BOOTSTRAP_DOMAIN: ${PEDALONS_BOOTSTRAP_DOMAIN:?set it in .env}
      PEDALONS_BOOTSTRAP_DOMAIN_NAME: ${PEDALONS_BOOTSTRAP_DOMAIN_NAME:?set it in .env}
      PEDALONS_BOOTSTRAP_BASE_URL: ${PEDALONS_BOOTSTRAP_BASE_URL:?set it in .env}
      PEDALONS_BOOTSTRAP_ADMIN_EMAIL: ${PEDALONS_BOOTSTRAP_ADMIN_EMAIL:?set it in .env}
      PEDALONS_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${PEDALONS_BOOTSTRAP_ADMIN_DISPLAY_NAME:?set it in .env}
    volumes:
      - ./data/storage:/mnt/storage
      - ./data/keys:/mnt/keys:ro
      # gpx2web's tile + elevation cache (DATA_CACHE_PATH). Shared with backend-restore, and kept
      # outside the container so it outlives `down`.
      - ./data/cache:/mnt/cache
    # Container labels for compose's Docker provider, the same list as service labels for Swarm's.
    labels: &backend-labels
      - "traefik.enable=true"
      - "traefik.stack=${ENV_NAME}"
      - "traefik.http.routers.quarkus.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.quarkus.priority=100"
      - "traefik.http.services.quarkus.loadbalancer.server.port=8080"
      # A task that is booting, or that got SIGTERM (quarkus.shutdown.delay), gets no traffic.
      - "traefik.http.services.quarkus.loadbalancer.healthcheck.path=/q/health/ready"
      - "traefik.http.services.quarkus.loadbalancer.healthcheck.interval=3s"
    # What Swarm waits for before stopping the old task. Boot runs Flyway, hence the start period.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 180s
    # Above quarkus.shutdown.delay + quarkus.shutdown.timeout (10s + 20s).
    stop_grace_period: 40s
    deploy:
      # Rolling update: the new task starts beside the old one, which is stopped only once the new
      # one is healthy. Both run against the same database for that while — a Flyway migration must
      # leave the schema usable by the previous release (see README, Deployment).
      update_config: &rolling-update
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: start-first
      # Spelled out, not left to the default: restore.sh scales backend, frontend and minio down and
      # back up, and on a service whose file says nothing, `docker stack deploy` keeps the current
      # count — a restore that died halfway would leave them at 0 through every later deploy.
      replicas: 1
      labels: *backend-labels

  frontend:
    image: pedalons-frontend:${ENV_NAME}${FRONTEND_IMAGE_SUFFIX:-}
    container_name: ${ENV_NAME}-frontend
    restart: unless-stopped
    networks:
      - pedalons
    environment:
      # The service name, not the container name: a Swarm task has none of its own.
      API_BASE_URL: http://backend:8080
    labels: &frontend-labels
      - "traefik.enable=true"
      - "traefik.stack=${ENV_NAME}"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.interval=3s"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    # Above server.js's SIGTERM drain.
    stop_grace_period: 20s
    deploy:
      replicas: 1
      update_config: *rolling-update
      rollback_config:
        order: start-first
      labels: *frontend-labels

  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: ${ENV_NAME}-postgres
    restart: unless-stopped
    networks:
      - pedalons
    # No published port here. Swarm cannot bind to the loopback (it drops `127.0.0.1:` and listens
    # on every interface), and a raw Postgres guarded by a password alone has no business there.
    # docker-compose.local.yml publishes it on a workstation; on a host, go through `docker exec`.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.15
    container_name: ${ENV_NAME}-imgproxy
    restart: unless-stopped
    networks:
      - pedalons
    depends_on:
      - minio
    environment:
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AUTO_AVIF: "true"
      IMGPROXY_AUTO_JXL: "true"
      IMGPROXY_QUALITY: "85"
      IMGPROXY_MAX_SRC_RESOLUTION: "50000000"
      IMGPROXY_MAX_ANIMATION_FRAMES: "100"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_USE_S3: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1

  varnish:
    image: varnish:9.0.4-5
    container_name: ${ENV_NAME}-varnish
    restart: unless-stopped
    networks:
      - pedalons
    # varnishd resolves the VCL's backend host at compile time: started before imgproxy, it dies on
    # "could not be resolved to an IP address" and only recovers through the restart policy.
    # Swarm ignores depends_on and relies on that recovery alone.
    depends_on:
      - imgproxy
    volumes:
      - "./services/varnish/varnish.vcl:/etc/varnish/default.vcl"
    # Swarm ignores this and varnishd keeps its working dir in the image's own /var/lib/varnish,
    # which it owns. A Swarm tmpfs mount takes no uid, and comes out unwritable for varnishd.
    tmpfs:
      # varnishd runs as uid/gid 1000; a root-owned tmpfs leaves it unable to create its working dir
      - /var/lib/varnish:exec,uid=1000,gid=1000
    environment:
      - VARNISH_SIZE=20G
    command: "-p default_ttl=86400"

  minio:
    # pgsty/minio, fork communautaire maintenu : l'image officielle a quitte Docker Hub en septembre
    # 2026 et l'edition communautaire amont est archivee (plus de release ni de correctif).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: ${ENV_NAME}-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - pedalons
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    deploy:
      replicas: 1

volumes:
  postgres_data:
  minio_data:

networks:
  # Nom explicite : traefik en a besoin pour --providers.swarm.network, qui ne peut pas deviner le
  # nom derive de la stack. `attachable` : backend-restore (docker-compose.restore.yml) est un
  # conteneur ordinaire, pas un service Swarm, et doit pouvoir s'y brancher. Sur un poste,
  # docker-compose.local.yml en refait un reseau bridge.
  pedalons:
    name: ${ENV_NAME}-net
    driver: overlay
    attachable: true
  # Fourni par docker-compose.shared.yml (valhalla, tileserver). Le deploiement echoue tant que la
  # stack partagee n'a pas ete demarree, plutot que de creer un reseau vide.
  shared:
    name: pedalons-shared
    external: true
