services:
  # Reverse proxy
  traefik:
    image: traefik:v3.7
    container_name: ${ENV_NAME}-traefik
    restart: unless-stopped
    networks:
      - pedalons
    ports:
      # Loopback uniquement : le TLS est termine par Caddy sur l'hote.
      - "127.0.0.1:${HTTP_PORT:-8090}:80"
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      - "--log.level=WARN"
      # Pas de journal d'acces ici : celui du Caddy de l'hote est le seul, masque et borne a
      # 14 jours (docs/OPERATIONS.md, « Access logs »). Traefik ne sait pas masquer un parametre
      # de requete, et son fichier, sans volume, mourait avec le conteneur.
      - "--accesslog=false"
      - "--providers.docker.constraints=Label(`traefik.stack`,`${ENV_NAME}`)"
      # backend est attache a deux reseaux : sans ce reglage le provider Docker choisit une IP au
      # hasard entre les deux, et une IP `pedalons-shared` -- que traefik ne joint pas -- donne des
      # 502 sur /api.
      - "--providers.docker.network=${ENV_NAME}-net"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=false"

  backend:
    image: pedalons-backend:${ENV_NAME}
    container_name: ${ENV_NAME}-backend
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    networks:
      - pedalons
      # valhalla + tileserver vivent dans la stack pedalons-shared (docker-compose.shared.yml).
      - shared
    env_file:
      - .env
    environment:
      ERROR_LOG_DETAILS: "false"
      # Restated from .env with :? so a missing value stops `up` instead of booting a broken Domain.
      PEDALONS_BOOTSTRAP_DOMAIN: ${PEDALONS_BOOTSTRAP_DOMAIN:?set it in .env}
      PEDALONS_BOOTSTRAP_DOMAIN_NAME: ${PEDALONS_BOOTSTRAP_DOMAIN_NAME:?set it in .env}
      PEDALONS_BOOTSTRAP_BASE_URL: ${PEDALONS_BOOTSTRAP_BASE_URL:?set it in .env}
      PEDALONS_BOOTSTRAP_ADMIN_EMAIL: ${PEDALONS_BOOTSTRAP_ADMIN_EMAIL:?set it in .env}
      PEDALONS_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${PEDALONS_BOOTSTRAP_ADMIN_DISPLAY_NAME:?set it in .env}
    volumes:
      - ./data/storage:/mnt/storage
      - ./data/keys:/mnt/keys:ro
      # gpx2web's tile + elevation cache (DATA_CACHE_PATH), kept outside the container so it outlives
      # `down`.
      - ./data/cache:/mnt/cache
    labels:
      - "traefik.enable=true"
      - "traefik.stack=${ENV_NAME}"
      - "traefik.http.routers.quarkus.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.quarkus.priority=100"
      - "traefik.http.services.quarkus.loadbalancer.server.port=8080"

  frontend:
    image: pedalons-frontend:${ENV_NAME}
    container_name: ${ENV_NAME}-frontend
    restart: unless-stopped
    networks:
      - pedalons
    environment:
      API_BASE_URL: http://${ENV_NAME}-backend:8080
    labels:
      - "traefik.enable=true"
      - "traefik.stack=${ENV_NAME}"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.priority=1"

  postgres:
    # imresamu/postgis, not postgis/postgis: same builds (by a docker-postgis maintainer), but
    # published for arm64 too — the official image is amd64-only, which Docker VMM on Apple
    # Silicon cannot run.
    image: imresamu/postgis:17-3.5-alpine
    container_name: ${ENV_NAME}-postgres
    restart: unless-stopped
    networks:
      - pedalons
    # Loopback-only: lets the dev backend and a SQL client reach the DB from the host
    # without exposing it beyond this machine.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.16
    container_name: ${ENV_NAME}-imgproxy
    restart: unless-stopped
    networks:
      - pedalons
    depends_on:
      - minio
    environment:
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AUTO_AVIF: "true"
      IMGPROXY_AUTO_JXL: "true"
      IMGPROXY_QUALITY: "85"
      IMGPROXY_MAX_SRC_RESOLUTION: "50000000"
      IMGPROXY_MAX_ANIMATION_FRAMES: "100"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_USE_S3: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1

  varnish:
    image: varnish:9.0.4-5
    container_name: ${ENV_NAME}-varnish
    restart: unless-stopped
    networks:
      - pedalons
    # varnishd resolves the VCL's backend host at compile time: started before imgproxy, it dies on
    # "could not be resolved to an IP address" and only recovers through the restart policy.
    depends_on:
      - imgproxy
    volumes:
      - "./services/varnish/varnish.vcl:/etc/varnish/default.vcl"
    tmpfs:
      # varnishd runs as uid/gid 1000; a root-owned tmpfs leaves it unable to create its working dir
      - /var/lib/varnish:exec,uid=1000,gid=1000
    environment:
      - VARNISH_SIZE=20G
    command: "-p default_ttl=86400"

  minio:
    # pgsty/minio, fork communautaire maintenu : l'image officielle a quitte Docker Hub en septembre
    # 2026 et l'edition communautaire amont est archivee (plus de release ni de correctif).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: ${ENV_NAME}-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - pedalons
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:

networks:
  # Nom explicite : traefik en a besoin pour --providers.docker.network, qui ne peut pas deviner le
  # nom derive du projet compose.
  pedalons:
    name: ${ENV_NAME}-net
  # Fourni par docker-compose.shared.yml (valhalla, tileserver). `up` echoue tant que la stack
  # partagee n'a pas ete demarree, plutot que de creer un reseau vide.
  shared:
    name: pedalons-shared
    external: true
