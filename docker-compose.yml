services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: tribly-postgres
    environment:
      POSTGRES_USER: tribly
      POSTGRES_PASSWORD: tribly_dev_password
      POSTGRES_DB: tribly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tribly"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: tribly-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
      KC_HEALTH_ENABLED: true
    ports:
      - "8180:8180"
    volumes:
      - ./backend/src/main/resources/keycloak/dev-realm.json:/opt/keycloak/data/import/quarkus-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8180;echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tribly-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tribly.app
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

  mailhog:
    image: mailhog/mailhog:latest
    container_name: tribly-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles:
      - tools

volumes:
  postgres_data:
