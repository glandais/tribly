services:
  # Reverse proxy
  traefik:
    image: traefik:3.6
    container_name: tribly-traefik
    restart: unless-stopped
    networks:
      - tribly
    ports:
      - "${HTTP_PORT:-8090}:80"
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=WARN"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--providers.docker.constraints=Label(`traefik.stack`,`${TRAEFIK_STACK}`)"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=false"

  backend:
    image: ghcr.io/glandais/tribly-backend:latest
    container_name: tribly-backend
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - tribly
    env_file:
      - .env
    volumes:
      - ./data/storage:/mnt/storage
    labels:
      - "traefik.enable=true"
      - "traefik.stack=${TRAEFIK_STACK}"
      - "traefik.http.routers.quarkus.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.quarkus.priority=100"
      - "traefik.http.services.quarkus.loadbalancer.server.port=8080"

  frontend:
    image: ghcr.io/glandais/tribly-frontend:latest
    container_name: tribly-frontend
    restart: unless-stopped
    networks:
      - tribly
    labels:
      - "traefik.enable=true"
      - "traefik.stack=${TRAEFIK_STACK}"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.frontend.priority=1"

  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: tribly-postgres
    restart: unless-stopped
    networks:
      - tribly
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: tribly-keycloak
    restart: unless-stopped
    networks:
      - tribly
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8180:8180"
    command: start --import-realm
    environment:
      JAVA_OPTS_APPEND: "-Djava.net.preferIPv4Stack=true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KC_HTTP_PORT: "8180"
      KC_HEALTH_ENABLED: "true"
      # Database (uses same PostgreSQL instance)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Production proxy settings (Traefik terminates TLS)
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    labels:
      - "traefik.enable=true"
      - "traefik.stack=${TRAEFIK_STACK}"
      - "traefik.http.routers.keycloak.rule=PathPrefix(`/realms`) || PathPrefix(`/resources`) || PathPrefix(`/js`)"
      - "traefik.http.routers.keycloak.priority=50"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8180"
    volumes:
      - ./services/keycloak/tribly-realm.json:/opt/keycloak/data/import/tribly-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8180;echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v3.30.1
    container_name: tribly-imgproxy
    restart: unless-stopped
    networks:
      - tribly
    volumes:
      - "./data/storage:/mnt/storage:ro"
    environment:
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AUTO_AVIF: "true"
      IMGPROXY_AUTO_JXL: "true"
      IMGPROXY_QUALITY: "85"
      IMGPROXY_MAX_SRC_RESOLUTION: "50000000"
      IMGPROXY_MAX_ANIMATION_FRAMES: "100"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: "/mnt/storage"
      IMGPROXY_USE_ETAG: "true"

  varnish:
    image: varnish:6.0.14
    container_name: tribly-varnish
    restart: unless-stopped
    networks:
      - tribly
    volumes:
      - "./services/varnish/varnish.vcl:/etc/varnish/default.vcl"
    tmpfs:
      - /var/lib/varnish:exec
    environment:
      - VARNISH_SIZE=20G
    command: "-p default_ttl=86400"

  brouter:
    build: ./services/brouter
    container_name: tribly-brouter
    restart: unless-stopped
    networks:
      - tribly
    volumes:
      - ./data/segments4:/opt/brouter/segments4:ro
    environment:
      BROUTER_THREADS: "8"

volumes:
  postgres_data:

networks:
  tribly:
