# The Biketeam migration: a one-shot, run-to-completion job. It used to sit in docker-compose.yml
# behind a `restore` profile, but `profiles:` makes `docker stack deploy` fail, and a job that must
# run once and stop is no Swarm service anyway. So it is an ordinary container, started by compose
# next to whichever stack is running — Swarm on a host, compose on a workstation:
#
#   docker compose -f docker-compose.restore.yml run --rm backend-restore
#
# `-f` matters on a workstation: it overrides the COMPOSE_FILE of the local .env, which would
# otherwise load the whole stack into this project.
#
# Both networks are joined as `external`: they belong to the running stack, which must be up. On a
# host they are Swarm overlays, declared `attachable` for exactly this. On a workstation the shared
# one is docker-compose.local.yml's project network — set SHARED_NETWORK=${ENV_NAME}-shared in the
# local .env.
#
# A project of its own, so the running stack's containers are not taken for this one's orphans.
name: ${ENV_NAME}-restore

services:
  backend-restore:
    image: pedalons-backend:${ENV_NAME}
    container_name: ${ENV_NAME}-backend-restore
    restart: "no"
    user: "${PUID:-1000}:${PGID:-1000}"
    networks:
      - pedalons
      - shared
    env_file:
      - .env
    environment:
      ERROR_LOG_DETAILS: "false"
      # Writes into this Domain — same values as the backend service, from .env.
      PEDALONS_BOOTSTRAP_DOMAIN: ${PEDALONS_BOOTSTRAP_DOMAIN:?set it in .env}
      PEDALONS_BOOTSTRAP_DOMAIN_NAME: ${PEDALONS_BOOTSTRAP_DOMAIN_NAME:?set it in .env}
      PEDALONS_BOOTSTRAP_BASE_URL: ${PEDALONS_BOOTSTRAP_BASE_URL:?set it in .env}
      PEDALONS_BOOTSTRAP_ADMIN_EMAIL: ${PEDALONS_BOOTSTRAP_ADMIN_EMAIL:?set it in .env}
      PEDALONS_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${PEDALONS_BOOTSTRAP_ADMIN_DISPLAY_NAME:?set it in .env}
      PEDALONS_MIGRATION_BIKETEAM_ENABLED: "true"
      # Unset: migrate every biketeam team. Set to a team id to migrate just that one.
      # PEDALONS_MIGRATION_BIKETEAM_TEAM_ID: "n-peloton"
      PEDALONS_MIGRATION_BIKETEAM_DATA_DIR: "/mnt/biketeam/production/data"
      # A mail domain, not a hostname: biketeam users with no email get strava_<id>@<this>.
      PEDALONS_MIGRATION_BIKETEAM_PLACEHOLDER_EMAIL_DOMAIN: "pedalons.fr"
      BIKETEAM_DB_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/biketeam_import
      BIKETEAM_DB_USER: ${POSTGRES_USER}
      BIKETEAM_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/storage:/mnt/storage
      - ./data/keys:/mnt/keys:ro
      - ./data/cache:/mnt/cache
      - ../biketeam-backup:/mnt/biketeam:ro

networks:
  pedalons:
    name: ${ENV_NAME}-net
    external: true
  shared:
    name: ${SHARED_NETWORK:-pedalons-shared}
    external: true
