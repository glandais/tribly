      - adSlug
    web: true

  # --- Platform admin ---
  # Kept off "/admin" so that on a pinned single-team host the clean "/admin"
  # URL maps to that team's admin (see frontend/src/config/pinnedHistory.ts).
  - id: admin
    path:
      en: /platform
      fr: /plateforme
    web: true
  - id: adminDomains
    path:
      en: /platform/domains
      fr: /plateforme/domaines
    web: true
  - id: adminTeams
    path:
      en: /platform/teams
      fr: /plateforme/equipes
    web: true
  - id: adminUsers
    path:
      en: /platform/users
      fr: /plateforme/utilisateurs
    web: true
