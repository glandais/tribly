      - media
      - surfaceType
      - visibility
      properties:
        name:
          type: string
          description: Route name
          pattern: \S
          minLength: 3
          maxLength: 200
        media:
          description: Media
          type: object
          $ref: "#/components/schemas/MediaDto"
        surfaceType:
          description: Surface type
