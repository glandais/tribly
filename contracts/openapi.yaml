paths:
  /api/admin/domains:
    get:
      summary: List all domains
      description: Get a paginated list of all domains
      operationId: listDomains
      tags:
      - Admin - Domains
      parameters:
      - description: Page number (0-indexed)
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - description: Page size
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Domains retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDomainListResponse"
        "403":
          description: Forbidden - not a platform admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not Authorized
      security:
      - SecurityScheme:
        - user
    post:
      summary: Create domain
      description: Create a new domain
      operationId: createDomain
      tags:
      - Admin - Domains
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDomainRequest"
        required: true
      responses:
        "201":
          description: Domain created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDomainDto"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - not a platform admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not Authorized
      security:
      - SecurityScheme:
        - user
  /api/admin/domains/stats:
    get:
      summary: Get platform statistics
      description: Get overall platform statistics
      operationId: getStats
      tags:
      - Admin - Domains
      responses:
        "200":
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatsDto"
        "403":
          description: Forbidden - not a platform admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not Authorized
      security:
      - SecurityScheme:
        - user
  /api/admin/domains/{domainId}:
    put:
      summary: Update domain
      description: Update domain information
      operationId: updateDomain
      tags:
      - Admin - Domains
      parameters:
      - description: Domain ID
        name: domainId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDomainRequest"
        required: true
      responses:
        "200":
          description: Domain updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDomainDto"
        "404":
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - not a platform admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not Authorized
        "400":
          description: Bad Request
      security:
      - SecurityScheme:
        - user
    get:
      summary: Get domain details
      description: Get detailed domain information
      operationId: getDomain
      tags:
      - Admin - Domains
      parameters:
      - description: Domain ID
        name: domainId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Domain retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDomainDto"
        "404":
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - not a platform admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not Authorized
      security:
      - SecurityScheme:
        - user
  /api/admin/domains/{domainId}/toggle-active:
    post:
      summary: Toggle domain active status
      description: Enable or disable a domain
      operationId: toggleDomainActive
      tags:
      - Admin - Domains
      parameters:
      - description: Domain ID
        name: domainId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Domain status toggled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDomainDto"
        "404":
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - not a platform admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not Authorized
      security:
      - SecurityScheme:
        - user
  /api/admin/teams:
    get:
      summary: List all teams
      description: Get a paginated list of all teams
      operationId: adminListTeams
      tags:
      - Admin - Teams
      parameters:
      - description: Filter by domain ID
        name: domainId
        in: query
        schema:
          type: string
      - description: Page number (0-indexed)
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - description: Page size
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
