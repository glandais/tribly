---
openapi: 3.1.0
components:
  schemas:
    AddMemberRequest:
      description: Request to add a member to the team
      type: object
      required:
      - userId
      properties:
        userId:
          type: string
          description: User ID (TSID) to add
          examples:
          - 0h4a8xzk8jv80
        role:
          description: Role to assign (defaults to MEMBER)
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/TeamRole"
          - type: "null"
    ClimbCategory:
      type: string
      enum:
      - HC
      - CAT1
      - CAT2
      - CAT3
      - CAT4
    ClimbListResponse:
      description: Climb list response
      type: object
      required:
      - climbs
      properties:
        climbs:
          type: array
          items:
            $ref: "#/components/schemas/RouteClimbDto"
          description: List of climbs on the route
    ConfigDto:
      description: Application configuration
      type: object
      required:
      - keycloak
      - map
      properties:
        keycloak:
          description: Keycloak authentication configuration
          type: object
          $ref: "#/components/schemas/KeycloakConfig"
        map:
          description: Map configuration
          type: object
          $ref: "#/components/schemas/MapConfig"
    CreateTeamRequest:
      description: Team creation request
      type: object
      required:
      - name
      - visibility
      properties:
        name:
          type: string
          description: Team name
          examples:
          - Awesome Cycling Team
          pattern: \S
          minLength: 2
          maxLength: 255
        description:
          type:
          - string
          - "null"
          description: Team description
          examples:
          - A team for weekend warriors
          maxLength: 2000
        visibility:
          description: Whether the team is publicly visible
          type: string
          examples:
          - "true"
          $ref: "#/components/schemas/Visibility"
        maxMembers:
          type:
          - integer
          - "null"
          format: int32
          description: Maximum number of members (null = unlimited)
          examples:
          - 50
    ErrorResponse:
      description: Error response
      type: object
      required:
      - code
      - message
      - path
      - timestamp
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
        path:
          type: string
          description: Request path
        timestamp:
          description: Timestamp
          type: string
          $ref: "#/components/schemas/Instant"
        errors:
          type:
          - array
          - "null"
          items:
            $ref: "#/components/schemas/FieldError"
          description: Field validation errors
        details:
          type:
          - object
          - "null"
          additionalProperties: {}
          description: Additional details
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        rejectedValue: {}
    GpxTrackDto:
      description: GPX track with track points
      type: object
      required:
      - id
      - trackPoints
      properties:
        id:
          type: string
          description: Track ID (TSID)
        name:
          type: string
          description: Track name
        trackPoints:
          type: array
          items:
            $ref: "#/components/schemas/TrackPointDto"
          description: List of track points
        processedAt:
          type:
          - string
          - "null"
          description: Processing timestamp
    GroupRequest:
      description: Ride group creation request
      type: object
      properties:
        id:
          type:
          - string
          - "null"
          description: id
        name:
          type: string
          description: Group name
          examples:
          - Fast Group
          pattern: \S
          minLength: 1
          maxLength: 100
        description:
          type:
          - string
          - "null"
          description: Group description
        averageSpeed:
          type:
          - integer
          - "null"
          format: int32
          description: Average speed in km/h
          examples:
          - 25
        maxParticipants:
          type:
          - integer
          - "null"
          format: int32
          description: Maximum participants
        routeId:
          type:
          - string
          - "null"
          description: Route ID (TSID) for this group
      required:
      - name
    Instant:
      type: string
      format: date-time
      examples:
      - 2022-03-10T16:15:50Z
    JoinGroupRequest:
      description: Request to join a ride group
      type: object
      properties:
        notes:
          type:
          - string
          - "null"
          description: Optional notes for the organizer
    KeycloakConfig:
      type: object
      description: Keycloak configuration
      required:
      - url
      - realm
      - clientId
      properties:
        url:
          type: string
          description: Keycloak server URL
          examples:
          - http://localhost:8180
        realm:
          type: string
          description: Keycloak realm name
          examples:
          - quarkus
        clientId:
          type: string
          description: Keycloak client ID
          examples:
          - tribly-frontend
    LocalDate:
      type: string
      format: date
      examples:
      - 2022-03-10
    LocalTime:
      type: string
      format: local-time
      examples:
      - 13:45:30.123456789
      externalDocs:
        description: As defined by 'partial-time' in RFC3339
        url: https://www.rfc-editor.org/rfc/rfc3339.html#section-5.6
    MapConfig:
      type: object
      description: Map configuration
      required:
      - tileUrl
      - attribution
      properties:
        tileUrl:
          type: string
          description: Map tile URL template
          examples:
          - "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
        attribution:
          type: string
          description: Map attribution text
    MemberDto:
      description: Team member information
      type: object
      required:
      - id
      - userId
      - displayName
      - role
      properties:
        id:
          type: string
          description: Membership ID (TSID)
        userId:
          type: string
          description: User ID (TSID)
        displayName:
          type: string
          description: User display name
        avatarUrl:
          type:
          - string
          - "null"
          description: User avatar URL
        role:
          description: Member role
          type: string
          $ref: "#/components/schemas/TeamRole"
        joinedAt:
          type:
          - string
          - "null"
          description: When the user joined the team
    MemberListResponse:
      description: Paginated member list response
      type: object
      required:
      - members
      - total
      - page
      - size
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberDto"
          description: List of members
        total:
          type: integer
          format: int64
          description: Total number of members
        page:
          type: integer
          format: int32
          description: Current page number
        size:
          type: integer
          format: int32
          description: Page size
    ParticipationStatus:
      type: string
      enum:
      - REGISTERED
      - CONFIRMED
      - CANCELLED
      - COMPLETED
    PublicUserDto:
      description: Public user information (limited fields)
      type: object
      required:
      - id
      - displayName
      properties:
        id:
          type: string
          description: User ID (TSID)
          examples:
          - 0h4a8xzk8jv80
        displayName:
          type: string
          description: User display name
        avatarUrl:
          type:
          - string
          - "null"
          description: User avatar URL
    RideDto:
      description: Ride summary data
      type: object
      required:
      - id
      - slug
      - title
      - date
      - status
      - visibility
      - participantCount
      - groupCount
      - groups
      properties:
        id:
          type: string
          description: Ride ID (TSID)
        slug:
          type: string
          description: Ride URL slug
        title:
          type: string
          description: Ride title
        description:
          type:
          - string
          - "null"
          description: Ride description
        date:
          description: Ride date
          type: string
          $ref: "#/components/schemas/LocalDate"
        startTime:
          description: Start time
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/LocalTime"
          - type: "null"
        status:
          description: Ride status
          type: string
          $ref: "#/components/schemas/RideStatus"
        visibility:
          description: Visibility level
          type: string
          $ref: "#/components/schemas/Visibility"
        routeId:
          type:
          - string
          - "null"
          description: Route id
        participantCount:
          type: integer
          format: int32
          description: Number of participants
        groupCount:
          type: integer
          format: int32
          description: Number of groups
        groups:
          type: array
          items:
            $ref: "#/components/schemas/RideGroupDto"
          description: Ride groups
        publishAt:
          description: Publication timestamp
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/Instant"
          - type: "null"
        createdAt:
          type:
          - string
          - "null"
          description: Creation timestamp
    RideGroupDto:
      type: object
      description: Ride group information
      required:
      - id
      - name
      - currentParticipants
      - sortOrder
      properties:
        id:
          type: string
          description: Group ID (TSID)
        name:
          type: string
          description: Group name
        description:
          type:
          - string
          - "null"
          description: Group description
        routeId:
          type:
          - string
          - "null"
          description: Route id
        averageSpeed:
          type:
          - integer
          - "null"
          format: int32
          description: Average speed in km/h
        maxParticipants:
          type:
          - integer
          - "null"
          format: int32
          description: Maximum participants
        currentParticipants:
          type: integer
          format: int32
          description: Current number of participants
        sortOrder:
          type: integer
          format: int32
          description: Sort order
    RideGroupListResponse:
      description: Ride group list response
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RideGroupDto"
          description: List of ride groups
    RideListResponse:
      description: Paginated ride list response
      type: object
      required:
      - rides
      - total
      - page
      - size
      properties:
        rides:
          type: array
          items:
            $ref: "#/components/schemas/RideDto"
          description: List of rides
        total:
          type: integer
          format: int64
          description: Total number of rides
        page:
          type: integer
          format: int32
          description: Current page number
        size:
          type: integer
          format: int32
          description: Page size
    RideParticipationDto:
      description: Ride participation information
      type: object
      required:
      - id
      - userId
      - status
      properties:
        id:
          type: string
          description: Participation ID (TSID)
        userId:
          type: string
          description: User ID (TSID)
        status:
          description: Participation status
          type: string
          $ref: "#/components/schemas/ParticipationStatus"
        registeredAt:
          type:
          - string
          - "null"
          description: Registration timestamp
        notes:
          type:
          - string
          - "null"
          description: Participant notes
    RideRequest:
      description: Ride request
      type: object
      required:
      - title
      - date
      - status
      - visibility
      - groups
      properties:
        title:
          type: string
          description: Ride title
          examples:
          - Sunday Morning Ride
          pattern: \S
          minLength: 3
          maxLength: 200
        description:
          type:
          - string
          - "null"
          description: Ride description
          maxLength: 5000
        date:
          description: Ride date
          type: string
          examples:
          - 2025-06-15
          $ref: "#/components/schemas/LocalDate"
        startTime:
          description: Start time
          type:
          - string
          - "null"
          examples:
          - 09:00
          anyOf:
          - $ref: "#/components/schemas/LocalTime"
          - type: "null"
        status:
          description: Ride status
          type: string
          $ref: "#/components/schemas/RideStatus"
        visibility:
          description: Visibility level
          type: string
          $ref: "#/components/schemas/Visibility"
        routeId:
          type:
          - string
          - "null"
          description: Route ID (TSID)
        meetingPointId:
          type:
          - string
          - "null"
          description: Meeting point ID (TSID)
        publishAt:
          description: Publication timestamp (for scheduled publishing)
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/Instant"
          - type: "null"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupRequest"
          description: Ride groups to create
    RideStatus:
      type: string
      enum:
      - DRAFT
      - PUBLISHED
      - CANCELLED
    RouteClimbDto:
      type: object
      description: Climb segment information
      required:
      - id
      - startDistance
      - endDistance
      - elevationGain
      - averageGradient
      - maxGradient
      properties:
        id:
          type: string
          description: Climb ID (TSID)
        name:
          type:
          - string
          - "null"
          description: Climb name (if named)
        startDistance:
          type: integer
          format: int32
          description: Start distance from route start in meters
        endDistance:
          type: integer
          format: int32
          description: End distance from route start in meters
        elevationGain:
          type: integer
          format: int32
          description: Elevation gain in meters
        averageGradient:
          type: number
          description: Average gradient percentage
        maxGradient:
          type: number
          description: Maximum gradient percentage
        category:
          description: "Climb category (HC, 1, 2, 3, 4)"
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/ClimbCategory"
          - type: "null"
    RouteDetailDto:
      description: Detailed route information
      type: object
      required:
      - id
      - name
      - description
      - distance
      - elevationGain
      - elevationLoss
      - difficulty
      - surfaceType
      - visibility
      - thumbnailUrl
      - startLat
      - startLng
      - endLat
      - endLng
      - createdById
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          description: Route ID (TSID)
        name:
          type: string
          description: Route name
        description:
          type: string
          description: Route description
        distance:
          type: integer
          format: int32
          description: Distance in meters
        elevationGain:
          type: integer
          format: int32
          description: Total elevation gain in meters
        elevationLoss:
          type: integer
          format: int32
          description: Total elevation loss in meters
        difficulty:
          description: Route difficulty
          type: string
          $ref: "#/components/schemas/RouteDifficulty"
        surfaceType:
          description: Surface type
          type: string
          $ref: "#/components/schemas/SurfaceType"
        visibility:
          description: Whether the route is public
          type: string
          $ref: "#/components/schemas/Visibility"
        thumbnailUrl:
          type: string
          description: Thumbnail image URL
        startLat:
          type: number
          description: Start point latitude
        startLng:
          type: number
          description: Start point longitude
        endLat:
          type: number
          description: End point latitude
        endLng:
          type: number
          description: End point longitude
        createdById:
          type: string
          description: Creator user ID (TSID)
        createdAt:
          type: string
          description: Creation timestamp
        updatedAt:
          type: string
          description: Last update timestamp
    RouteDifficulty:
      type: string
      enum:
      - EASY
      - MODERATE
      - HARD
      - EXPERT
    RouteDto:
      description: Route summary data
      type: object
      required:
      - id
      - name
      - distance
      - elevationGain
      - elevationLoss
      - difficulty
      - surfaceType
      - visibility
      - thumbnailUrl
      - createdAt
      properties:
        id:
          type: string
          description: Route ID (TSID)
        name:
          type: string
          description: Route name
        description:
          type:
          - string
          - "null"
          description: Route description
        distance:
          type: integer
          format: int32
          description: Distance in meters
        elevationGain:
          type: integer
          format: int32
          description: Total elevation gain in meters
        elevationLoss:
          type: integer
          format: int32
          description: Total elevation loss in meters
        difficulty:
          description: Route difficulty
          type: string
          $ref: "#/components/schemas/RouteDifficulty"
        surfaceType:
          description: Surface type
          type: string
          $ref: "#/components/schemas/SurfaceType"
        visibility:
          description: Whether the route is public
          type: string
          $ref: "#/components/schemas/Visibility"
        thumbnailUrl:
          type: string
          description: Thumbnail image URL
        createdAt:
          type: string
          description: Creation timestamp
    RouteListResponse:
      description: Paginated route list response
      type: object
      required:
      - routes
      - total
      - page
      - size
      properties:
        routes:
          type: array
          items:
            $ref: "#/components/schemas/RouteDto"
          description: List of routes
        total:
          type: integer
          format: int64
          description: Total number of routes
        page:
          type: integer
          format: int32
          description: Current page number
        size:
          type: integer
          format: int32
          description: Page size
    SurfaceType:
      type: string
      enum:
      - ROAD
      - GRAVEL
      - MTB
      - MIXED
    TeamDetailDto:
      description: Detailed team information
      type: object
      required:
      - id
      - name
      - slug
      - visibility
      - memberCount
      - createdAt
      properties:
        id:
          type: string
          description: Team ID (TSID)
          examples:
          - 0h4a8xzk8jv80
        name:
          type: string
          description: Team name
        slug:
          type: string
          description: Team URL slug
        description:
          type:
          - string
          - "null"
          description: Team description
        logoUrl:
          type:
          - string
          - "null"
          description: Logo image URL
        coverImageUrl:
          type:
          - string
          - "null"
          description: Cover image URL
        visibility:
          description: Whether the team is public
          type: string
          $ref: "#/components/schemas/Visibility"
        memberCount:
          type: integer
          format: int64
          description: Number of team members
        maxMembers:
          type:
          - integer
          - "null"
          format: int32
          description: Maximum number of members (null = unlimited)
        role:
          description: Current user's role (null if not a member)
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/TeamRole"
          - type: "null"
        createdAt:
          type: string
          description: Team creation timestamp
    TeamListResponse:
      description: Paginated team list response
      type: object
      required:
      - teams
      - total
      - page
      - size
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamDetailDto"
          description: List of teams
        total:
          type: integer
          format: int64
          description: Total number of teams
        page:
          type: integer
          format: int32
          description: Current page number
        size:
          type: integer
          format: int32
          description: Page size
    TeamRole:
      type: string
      enum:
      - ADMIN
      - ORGANIZER
      - MEMBER
    TrackPointDto:
      type: object
      description: GPS track point
      required:
      - lat
      - lng
      - ele
      - dist
      properties:
        lat:
          type: number
          format: double
          description: Latitude
        lng:
          type: number
          format: double
          description: Longitude
        ele:
          type: number
          format: double
          description: Elevation in meters
        dist:
          type: number
          format: double
          description: Distance from start in meters
    UpdateMemberRoleRequest:
      description: Request to update a member's role
      type: object
      required:
      - role
      properties:
        role:
          description: New role
          type: string
          $ref: "#/components/schemas/TeamRole"
    UpdateRouteRequest:
      description: Route update request
      type: object
      properties:
        name:
          type:
          - string
          - "null"
          description: Route name
        description:
          type:
          - string
          - "null"
          description: Route description
        difficulty:
          description: Route difficulty
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/RouteDifficulty"
          - type: "null"
        surfaceType:
          description: Surface type
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/SurfaceType"
          - type: "null"
        visibility:
          description: Whether the route is publicly visible
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/Visibility"
          - type: "null"
    UpdateTeamRequest:
      description: Team update request
      type: object
      properties:
        name:
          type:
          - string
          - "null"
          description: Team name
          minLength: 2
          maxLength: 255
        description:
          type:
          - string
          - "null"
          description: Team description
          maxLength: 2000
        visibility:
          description: Whether the team is publicly visible
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/Visibility"
          - type: "null"
        logoUrl:
          type:
          - string
          - "null"
          description: Logo image URL
        coverImageUrl:
          type:
          - string
          - "null"
          description: Cover image URL
        maxMembers:
          type:
          - integer
          - "null"
          format: int32
          description: Maximum number of members (null = unlimited)
    UpdateUserRequest:
      description: User profile update request
      type: object
      properties:
        displayName:
          type:
          - string
          - "null"
          description: User display name
          examples:
          - John Doe
          minLength: 1
          maxLength: 255
        locale:
          type:
          - string
          - "null"
          description: "User locale (e.g. 'en', 'fr')"
          examples:
          - en
          maxLength: 10
        timezone:
          type:
          - string
          - "null"
          description: User timezone (e.g. 'Europe/Paris')
          examples:
          - Europe/Paris
          maxLength: 50
    UserDto:
      description: User profile data
      type: object
      required:
      - id
      - email
      - displayName
      properties:
        id:
          type: string
          description: User ID (TSID)
          examples:
          - 0h4a8xzk8jv80
        email:
          type: string
          description: User email address
        displayName:
          type: string
          description: User display name
        avatarUrl:
          type:
          - string
          - "null"
          description: User avatar URL
        locale:
          type:
          - string
          - "null"
          description: "User locale (e.g. 'en', 'fr')"
          examples:
          - en
        timezone:
          type:
          - string
          - "null"
          description: User timezone (e.g. 'Europe/Paris')
          examples:
          - Europe/Paris
        createdAt:
          type:
          - string
          - "null"
          description: Account creation timestamp
    Visibility:
      type: string
      enum:
      - TEAM
      - PUBLIC
  securitySchemes:
    SecurityScheme:
      type: openIdConnect
      openIdConnectUrl: http://localhost:8180/realms/tribly/.well-known/openid-configuration
      description: Authentication
tags:
- name: Configuration
  description: Application configuration endpoints
- name: Rides
  description: Ride management and participation operations
- name: Route Downloads
  description: Route file downloads and images
- name: Routes
  description: GPX route management operations
- name: Team Members
  description: Team membership management operations
- name: Teams
  description: Team management operations
- name: Users
  description: User profile management operations
paths:
  /api/config:
    get:
      summary: Get application configuration
      description: Get frontend configuration including Keycloak and map settings
      operationId: getConfig
      tags:
      - Configuration
      responses:
        "200":
          description: Configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigDto"
  /api/teams:
    get:
      summary: List public teams
      description: Get a paginated list of public teams with optional search
      operationId: listTeams
      tags:
      - Teams
      parameters:
      - description: "Membership (false : public not member, true : my teams)"
        name: member
        in: query
        schema:
          type: boolean
      - description: Page number (0-indexed)
        name: page
        in: query
        schema:
          type: integer
          format: int32
