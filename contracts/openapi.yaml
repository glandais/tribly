---
openapi: 3.1.0
components:
  schemas:
    AdDto:
      description: Ad data
      type: object
      required:
      - team
      - id
      - slug
      - name
      - media
      - status
      - visibility
      - adType
      - createdAt
      - updatedAt
      - createdById
      properties:
        team:
          description: Team
          type: object
          $ref: "#/components/schemas/TeamPublicationDto"
        id:
          type: string
          description: Ad ID (TSID)
        slug:
          type: string
          description: Ad URL slug
        name:
          type: string
          description: Ad name
        media:
          description: Ad media
          type: object
          $ref: "#/components/schemas/MediaDto"
        status:
          description: Ad status
          type: string
          $ref: "#/components/schemas/Status"
        visibility:
          description: Visibility level
          type: string
          $ref: "#/components/schemas/Visibility"
        adType:
          description: Ad type
          type: string
          $ref: "#/components/schemas/AdType"
        price:
          type: number
          description: Price
        rentalPeriod:
          description: Rental period
          type: string
          $ref: "#/components/schemas/RentalPeriod"
        latitude:
          type: number
          format: double
          description: Latitude
        longitude:
          type: number
          format: double
          description: Longitude
        locationDescription:
          type: string
          description: Location description
        createdAt:
          description: Creation timestamp
          type: string
          $ref: "#/components/schemas/Instant"
        updatedAt:
          description: Creation timestamp
          type: string
          $ref: "#/components/schemas/Instant"
        createdById:
          type: string
          description: Creator ID (TSID)
    AdListResponse:
      description: Paginated ad list response
      type: object
      required:
      - ads
      - total
      - page
      - size
      properties:
        ads:
          type: array
          items:
            $ref: "#/components/schemas/AdDto"
          description: List of ads
        total:
          type: integer
          format: int64
          description: Total number of ads
        page:
          type: integer
          format: int32
          description: Current page number
        size:
          type: integer
          format: int32
          description: Page size
    AdRequest:
      description: Ad request
      type: object
      required:
      - name
      - media
      - status
      - adType
      properties:
        name:
          type: string
          description: Ad name
          pattern: \S
          minLength: 1
          maxLength: 200
        media:
          description: Ad description
          type: object
          $ref: "#/components/schemas/MediaDto"
        status:
          description: Ad status
          type: string
          $ref: "#/components/schemas/Status"
        adType:
          description: Ad type
          type: string
          $ref: "#/components/schemas/AdType"
        price:
          type: number
          description: "Price (optional, null for 'contact for price')"
        rentalPeriod:
          description: Rental period (required for RENTAL type)
          type: string
          $ref: "#/components/schemas/RentalPeriod"
        locationDescription:
          type: string
          description: Location description
          maxLength: 200
    AdType:
      type: string
      enum:
      - SALE
      - RENTAL
      - WANTED
    AddMemberRequest:
      description: Request to add a member to the team
      type: object
      required:
      - userId
      properties:
        userId:
          type: string
          description: User ID (TSID) to add
          examples:
          - 0h4a8xzk8jv80
        role:
          description: Role to assign (defaults to MEMBER)
          type: string
          $ref: "#/components/schemas/TeamRole"
    AssetDimensionsDto:
      type: object
      properties:
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
    AssetDto:
      type: object
      required:
      - id
      - fileName
      - contentType
      - url
      properties:
        id:
          type: string
          description: ID (TSID)
        fileName:
          type: string
          description: Filename
        contentType:
          type: string
          description: Content-Type
        url:
          type: string
          description: url
        imageUrl:
          type: string
          description: image template url
        imageDimensions:
          description: image dimensions
          type: object
          $ref: "#/components/schemas/AssetDimensionsDto"
    AssetsDto:
      type: object
      properties:
        logo:
          description: Logo
          type: object
          $ref: "#/components/schemas/AssetDto"
        images:
          type: array
          items:
            $ref: "#/components/schemas/AssetDto"
          description: Images
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AssetDto"
          description: Attachments
        originalGpx:
          description: Original GPX
          type: object
          $ref: "#/components/schemas/AssetDto"
        gpx:
          description: GPX
          type: object
          $ref: "#/components/schemas/AssetDto"
        fit:
          description: FIT
          type: object
          $ref: "#/components/schemas/AssetDto"
        thumbnail:
          description: Thumbnail
          type: object
          $ref: "#/components/schemas/AssetDto"
      required:
      - images
      - attachments
    ClimbCategory:
      type: string
      enum:
      - HC
      - CAT1
      - CAT2
      - CAT3
      - CAT4
    ClimbDto:
      description: Climb segment information
      type: object
      required:
      - startDistance
      - endDistance
      - elevationGain
      - averageGradient
      - maxGradient
      properties:
        startDistance:
          type: integer
          format: int32
          description: Start distance from route start in meters
        endDistance:
          type: integer
          format: int32
          description: End distance from route start in meters
        elevationGain:
          type: integer
          format: int32
          description: Elevation gain in meters
        averageGradient:
          type: number
          description: Average gradient percentage
        maxGradient:
          type: number
          description: Maximum gradient percentage
        category:
          description: "Climb category (HC, 1, 2, 3, 4)"
          type: string
          $ref: "#/components/schemas/ClimbCategory"
    CommentDto:
      description: Comment data
      type: object
      required:
      - id
      - content
      - author
      - createdAt
      - replies
      properties:
        id:
          type: string
          description: Comment ID (TSID)
        content:
          type: string
          description: Comment content
        author:
          description: Comment author
          type: object
          $ref: "#/components/schemas/PublicUserDto"
        createdAt:
          description: Creation timestamp
          type: string
          $ref: "#/components/schemas/Instant"
        parentId:
          type: string
          description: Parent comment ID (for replies)
        replies:
          type: array
          items:
            $ref: "#/components/schemas/CommentDto"
          description: Replies to this comment
    CommentListResponse:
      description: List of comments response
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommentDto"
          description: "List of comments (top-level only, with nested replies)"
        total:
          type: integer
          format: int32
          description: Total count including replies
    CommentRequest:
      description: Comment creation request
      type: object
      required:
      - content
      properties:
        content:
          type: string
          description: Comment content
          pattern: \S
          maxLength: 5000
        parentId:
          type: string
          description: Parent comment ID for replies (optional)
    ConfigDto:
      description: Application configuration
      type: object
      required:
      - keycloak
      properties:
        keycloak:
          description: Keycloak authentication configuration
          type: object
          $ref: "#/components/schemas/KeycloakConfig"
    EntityType:
      type: string
      enum:
      - TEAM
      - USER
      - USER_TEAM
      - RIDE_TEMPLATE
      - RIDE_TEMPLATE_GROUP
      - PLACE
      - COMMENT
      - ASSET
      - TRIP
      - TRIP_STAGE
      - ROUTE
      - RIDE
      - RIDE_GROUP
      - AD
      - POST
      - TEAM_PAGE
      - PUBLICATION
      - ANY
    ErrorCode:
      type: string
      enum:
      - BAD_REQUEST
      - NOT_FOUND
      - UNAUTHORIZED
      - FORBIDDEN
      - INTERNAL_ERROR
      - UNKNOWN
      - VALIDATION
      - BUSINESS_RULE
      - LAST_ADMIN
      - ALREADY_REGISTERED
      - NOT_REGISTERED
      - INVALID_SLUG
      - SLUG_TAKEN
      - USER_NOT_SYNCED
      - GROUP_FULL
      - INVALID_VISIBILITY
      - PUBLIC_TRIP_PRIVATE_ROUTE
      - GPX_FAILURE
      - FILE_REQUIRED
      - TOO_MANY_TEAM_PAGES
      - GPX_EMPTY
      - INVALID_FORMAT
      - RENTAL_PERIOD_MISSING
      - STATUS_INVALID
      - PUBLIC_RIDE_PRIVATE_ROUTE
    ErrorDetails:
      oneOf:
      - $ref: "#/components/schemas/ErrorValidationDetails"
      - $ref: "#/components/schemas/NotFoundDetails"
      description: Error details
      discriminator:
        propertyName: type
        mapping:
          VALIDATION: "#/components/schemas/ErrorValidationDetails"
          NOT_FOUND: "#/components/schemas/NotFoundDetails"
      type: object
      properties:
        type:
          $ref: "#/components/schemas/ErrorCode"
    ErrorResponse:
      description: Error response
      type: object
      required:
      - code
      properties:
        code:
          description: Error code
          type: string
          $ref: "#/components/schemas/ErrorCode"
        errorDetails:
          description: Additional details
          type: object
          $ref: "#/components/schemas/ErrorDetails"
    ErrorValidationDetails:
      type: object
      required:
      - type
      - fieldErrors
      properties:
        type:
          description: Type
          type: string
          $ref: "#/components/schemas/ErrorCode"
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
          description: Field Errors
    FieldError:
      type: object
      required:
      - field
      - message
      - rejectedValue
      properties:
        field:
          type: string
          description: Field
        message:
          type: string
          description: Message
        rejectedValue:
          description: Rejected value
    GeoJsonLineString:
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          enum:
          - LineString
        coordinates:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
          description: "Array of [lon, lat] coordinates"
    GeoJsonPoint:
      description: GeoJSON Point geometry
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          examples:
          - Point
          enum:
          - Point
        coordinates:
          type: array
          items:
            type: number
            format: double
          description: "Coordinates [longitude, latitude]"
          examples:
          - - 2.3522
            - 48.8566
    GeoPoint:
      type: object
      required:
      - lng
      - lat
      properties:
        lng:
          type: number
          format: double
        lat:
          type: number
          format: double
    GroupRequest:
      description: Ride group creation request
      type: object
      properties:
        id:
          type: string
          description: id
        name:
          type: string
          description: Group name
          examples:
          - Fast Group
          pattern: \S
          minLength: 1
          maxLength: 200
        time:
          $ref: "#/components/schemas/LocalTime"
        averageSpeed:
          type: integer
          format: int32
          description: Average speed in km/h
          examples:
          - 25
          exclusiveMinimum: 0
        maxParticipants:
          type: integer
          format: int32
          description: Maximum participants
          examples:
          - 10
          exclusiveMinimum: 0
        routeSlug:
          type: string
          description: Route slug for this group
      required:
      - name
    Hilliness:
      type: string
      enum:
      - FLAT
      - HILLY
      - MOUNTAINOUS
    Instant:
      type: string
      format: date-time
      examples:
      - 2022-03-10T16:15:50Z
    KeycloakConfig:
      type: object
      description: Keycloak configuration
      required:
      - url
      - realm
      - clientId
      properties:
        url:
          type: string
          description: Keycloak server URL
          examples:
          - http://localhost:8180
        realm:
          type: string
          description: Keycloak realm name
          examples:
          - quarkus
        clientId:
          type: string
          description: Keycloak client ID
          examples:
          - tribly-frontend
    LocalTime:
      type: string
      format: local-time
      examples:
      - 13:45:30.123456789
      externalDocs:
        description: As defined by 'partial-time' in RFC3339
        url: https://www.rfc-editor.org/rfc/rfc3339.html#section-5.6
    MediaDto:
      type: object
      required:
      - markdown
      - assets
      properties:
        markdown:
          type: string
          description: Markdown
        assets:
          description: Assets
          type: object
          $ref: "#/components/schemas/AssetsDto"
    MemberDto:
      description: Team member information
      type: object
      required:
      - team
      - id
      - user
      - role
      properties:
        team:
          description: Team
          type: object
          $ref: "#/components/schemas/TeamPublicationDto"
        id:
          type: string
          description: Membership ID (TSID)
        user:
          description: User
          type: object
          $ref: "#/components/schemas/PublicUserDto"
        role:
          description: Member role
          type: string
          $ref: "#/components/schemas/TeamRole"
        joinedAt:
          description: When the user joined the team
          type: string
          $ref: "#/components/schemas/Instant"
    MemberListResponse:
      description: Paginated member list response
      type: object
      required:
      - members
      - total
      - page
      - size
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberDto"
          description: List of members
        total:
          type: integer
          format: int64
          description: Total number of members
        page:
          type: integer
          format: int32
          description: Current page number
        size:
          type: integer
          format: int32
          description: Page size
    MinRole:
      type: string
      enum:
      - NOT_MEMBER
      - MEMBER
      - ORGANIZER
      - ADMIN
    NearType:
      type: string
      enum:
      - START
      - END
      - START_OR_END
    NotFoundDetails:
      type: object
      required:
      - type
      - entityType
      - searchedBy
      - id
      properties:
        type:
          description: Type
          type: string
          $ref: "#/components/schemas/ErrorCode"
        entityType:
          description: Entity type
          type: string
          $ref: "#/components/schemas/EntityType"
        searchedBy:
          description: Search type
          type: string
          $ref: "#/components/schemas/SearchedBy"
        id:
          type: string
          description: id/slug
    PlaceDetailDto:
      type: object
      required:
      - id
      - name
      - startPlace
      - endPlace
      properties:
        id:
          type: string
          description: Place ID (TSID)
          examples:
          - 0h4a8xzk8jv80
        name:
          type: string
        address:
          type: string
        link:
          type: string
        startPlace:
          type: boolean
        endPlace:
          type: boolean
        geometry:
          $ref: "#/components/schemas/GeoJsonPoint"
          type: object
    PlaceListResponse:
      description: Paginated place list response
      type: object
      required:
      - places
      - total
      - page
      - size
      properties:
        places:
          type: array
          items:
            $ref: "#/components/schemas/PlaceDetailDto"
          description: List of places
        total:
          type: integer
          format: int64
          description: Total number of places
        page:
          type: integer
          format: int32
          description: Current page number
        size:
          type: integer
          format: int32
          description: Page size
    PlaceRequest:
      description: Place create/update request
      type: object
      required:
      - name
      - startPlace
      - endPlace
      properties:
        name:
          type: string
          description: Place name
          pattern: \S
          minLength: 1
          maxLength: 200
        address:
          type: string
          description: Address
          minLength: 3
          maxLength: 200
        link:
          type: string
          description: "External link (e.g., Google Maps URL)"
          pattern: ""
          minLength: 3
          maxLength: 200
        startPlace:
          type: boolean
          description: Can be used as ride start point
        endPlace:
          type: boolean
          description: Can be used as ride end point
        coordinates:
          description: "Geographic coordinates [longitude, latitude]"
          type: object
          required:
          - type
          - coordinates
          properties:
            type:
              type: string
              examples:
              - Point
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: double
              description: "Coordinates [longitude, latitude]"
              examples:
              - - 2.3522
                - 48.8566
    PostDto:
      description: Post summary data
      type: object
      required:
      - type
      - team
      - id
      - slug
      - name
      - media
      - dateTime
      - status
      - visibility
      properties:
        type:
          description: Type
          type: string
          $ref: "#/components/schemas/PublicationType"
        team:
          description: Team
          type: object
          $ref: "#/components/schemas/TeamPublicationDto"
        id:
          type: string
          description: Publication ID (TSID)
        slug:
          type: string
          description: Publication URL slug
        name:
          type: string
          description: Publication name
        media:
          description: Publication media
          type: object
          $ref: "#/components/schemas/MediaDto"
        dateTime:
          description: Publication date/time
          type: string
          $ref: "#/components/schemas/Instant"
        status:
          description: Publication status
          type: string
          $ref: "#/components/schemas/Status"
        visibility:
          description: Visibility level
          type: string
          $ref: "#/components/schemas/Visibility"
        publishAt:
          description: Publication timestamp
          type: string
          $ref: "#/components/schemas/Instant"
        createdAt:
          description: Creation timestamp
          type: string
          $ref: "#/components/schemas/Instant"
    PostListResponse:
      description: Paginated post list response
      type: object
      required:
      - posts
      - total
      - page
      - size
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/PostDto"
          description: List of posts
        total:
          type: integer
          format: int64
          description: Total number of posts
        page:
          type: integer
          format: int32
          description: Current page number
        size:
          type: integer
          format: int32
          description: Page size
    PostRequest:
      description: Post request
      type: object
      required:
      - name
      - media
      - dateTime
      - status
      - visibility
      properties:
        name:
          type: string
          description: Post name
          pattern: \S
          minLength: 1
          maxLength: 200
        media:
          description: Post description
          type: object
          $ref: "#/components/schemas/MediaDto"
        dateTime:
          description: Post date/time
          type: string
          $ref: "#/components/schemas/Instant"
        status:
          description: Post status
          type: string
          $ref: "#/components/schemas/Status"
        visibility:
          description: Visibility level
          type: string
          $ref: "#/components/schemas/Visibility"
        publishAt:
          description: Publication timestamp (for scheduled publishing)
          type: string
          $ref: "#/components/schemas/Instant"
    PublicUserDto:
      type: object
      description: Public user information (limited fields)
      required:
      - id
      - displayName
      properties:
        id:
          type: string
          description: User ID (TSID)
          examples:
          - 0h4a8xzk8jv80
        displayName:
          type: string
          description: User display name
        avatarUrl:
          type: string
          description: User avatar URL
    PublicationDto:
      oneOf:
      - $ref: "#/components/schemas/RideDto"
      - $ref: "#/components/schemas/PostDto"
      - $ref: "#/components/schemas/TripDto"
      description: Publication data
      discriminator:
        propertyName: type
        mapping:
          RIDE: "#/components/schemas/RideDto"
          POST: "#/components/schemas/PostDto"
          TRIP: "#/components/schemas/TripDto"
      type: object
      properties:
        type:
          $ref: "#/components/schemas/PublicationType"
        visibility:
          $ref: "#/components/schemas/Visibility"
        name:
          type: string
    PublicationListResponse:
      description: Paginated publication list response
      type: object
      required:
      - publications
      - total
      - page
      - size
      properties:
        publications:
          type: array
          items:
            $ref: "#/components/schemas/PublicationDto"
          description: List of publications
        total:
          type: integer
          format: int64
          description: Total number of publications
        page:
          type: integer
          format: int32
          description: Current page number
        size:
          type: integer
          format: int32
          description: Page size
    PublicationType:
      type: string
      enum:
      - RIDE
      - POST
      - TRIP
    RentalPeriod:
      type: string
      enum:
      - DAY
      - WEEK
      - MONTH
    ReorderPagesRequest:
      description: Request to reorder team pages
      type: object
      required:
      - pageIds
      properties:
        pageIds:
          type: array
          items:
            type: string
          description: Ordered list of page IDs
    RideDto:
      description: Ride summary data
      type: object
      required:
      - type
      - team
      - id
      - slug
      - name
      - media
      - dateTime
      - status
      - visibility
      - participantCount
      - groupCount
      - groups
      - topParticipants
      properties:
        type:
          description: Type
          type: string
          $ref: "#/components/schemas/PublicationType"
        team:
          description: Team
          type: object
          $ref: "#/components/schemas/TeamPublicationDto"
        id:
          type: string
          description: Publication ID (TSID)
        slug:
          type: string
          description: Publication URL slug
        name:
          type: string
          description: Publication name
        media:
          description: Publication media
          type: object
          $ref: "#/components/schemas/MediaDto"
        dateTime:
          description: Publication date/time
          type: string
          $ref: "#/components/schemas/Instant"
        status:
          description: Publication status
          type: string
          $ref: "#/components/schemas/Status"
        visibility:
          description: Visibility level
          type: string
          $ref: "#/components/schemas/Visibility"
        publishAt:
          description: Publication timestamp
          type: string
          $ref: "#/components/schemas/Instant"
        createdAt:
          description: Creation timestamp
          type: string
          $ref: "#/components/schemas/Instant"
        routeSlug:
          type: string
          description: Route slug
        participantCount:
          type: integer
          format: int32
          description: Number of participants
        groupCount:
          type: integer
          format: int32
          description: Number of groups
        groups:
          type: array
          items:
            $ref: "#/components/schemas/RideGroupDto"
          description: Ride groups
        startPlace:
          description: Start place
          type: object
          $ref: "#/components/schemas/PlaceDetailDto"
        endPlace:
          description: End place
          type: object
          $ref: "#/components/schemas/PlaceDetailDto"
        topParticipants:
          type: array
          items:
            $ref: "#/components/schemas/PublicUserDto"
          description: Preview of first participants (max 5)
        routeThumbnailUrl:
          type: string
          description: Route thumbnail URL
    RideGroupDto:
      type: object
      description: Ride group information
      required:
      - id
      - name
      - countParticipants
      - participants
      - sortOrder
      properties:
        id:
          type: string
          description: Group ID (TSID)
        name:
          type: string
          description: Group name
        time:
          $ref: "#/components/schemas/LocalTime"
        routeSlug:
          type: string
          description: Route slug
        averageSpeed:
          type: integer
          format: int32
          description: Average speed in km/h
        maxParticipants:
          type: integer
          format: int32
          description: Maximum participants
        countParticipants:
          type: integer
          format: int32
          description: Current number of participants
        participants:
          type: array
          items:
            $ref: "#/components/schemas/PublicUserDto"
          description: "Participants, empty if not access"
        sortOrder:
          type: integer
          format: int32
          description: Sort order
    RideListResponse:
      description: Paginated ride list response
      type: object
      required:
      - rides
      - total
      - page
      - size
