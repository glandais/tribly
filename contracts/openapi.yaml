  description: Ride template management operations
- name: Rides
  description: Ride management and participation operations
- name: Route Comments
  description: Comment operations for routes
- name: Router
  description: Route calculation using BRouter
- name: Routes
  description: GPX route management operations
- name: Team Members
  description: Team membership management operations
- name: Team Pages
  description: Team page management operations
- name: Teams
  description: Team management operations
- name: Trip Comments
  description: Comment operations for trips
- name: Trips
  description: Trip management and participation operations
- name: Users
  description: User profile management operations
paths:
  /api/config:
    get:
      summary: Get application configuration
      description: Get frontend configuration including Keycloak and map settings
      operationId: getConfig
      tags:
      - Configuration
      responses:
        "200":
          description: Configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigDto"
  /api/publications:
    get:
      summary: List all publications
      description: Get publications from all accessible teams (user's teams + public
        teams)
      operationId: listAllPublications
      tags:
      - Publications
      parameters:
      - description: Start date filter (ISO format)
        name: from
        in: query
        schema:
          type: string
      - description: Page number
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - description: Search by name/markdown
        name: search
        in: query
        schema:
          type: string
      - description: Page size
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      - description: End date filter (ISO format)
        name: to
        in: query
        schema:
          type: string
      - description: Types
        name: type
        in: query
        schema:
          $ref: "#/components/schemas/PublicationType"
      responses:
        "200":
          description: Publications retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationListResponse"
  /api/router:
    post:
      summary: Calculate route
      description: Calculate a cycling route between two points using BRouter
      operationId: route
      tags:
      - Router
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouterRequest"
        required: true
      responses:
        "200":
          description: Route calculated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterResponse"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: BRouter service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - user
  /api/routes:
    get:
      summary: List all routes
      description: Get paginated list of routes from all accessible teams (user's
        teams + public teams)
      operationId: listAllRoutes
      tags:
      - Routes
      parameters:
      - description: "Hilliness preset (FLAT, HILLY, MOUNTAINOUS)"
        name: hilliness
        in: query
        schema:
          $ref: "#/components/schemas/Hilliness"
      - description: Maximum distance in meters
        name: maxDistance
        in: query
        schema:
          type: integer
          format: int32
      - description: Maximum elevation gain in meters
        name: maxElevationGain
        in: query
        schema:
          type: integer
          format: int32
      - description: Minimum distance in meters
        name: minDistance
        in: query
        schema:
          type: integer
          format: int32
      - description: Minimum elevation gain in meters
        name: minElevationGain
        in: query
        schema:
          type: integer
          format: int32
      - description: Latitude for proximity search
        name: nearLat
        in: query
        schema:
          type: number
          format: double
      - description: Longitude for proximity search
        name: nearLon
        in: query
        schema:
          type: number
          format: double
      - description: "Search radius in meters (default: 25000)"
        name: nearRadius
        in: query
        schema:
          type: integer
          format: int32
      - description: "Search near START, END, or START_OR_END (default)"
        name: nearType
        in: query
        schema:
          $ref: "#/components/schemas/NearType"
      - description: Page number (0-indexed)
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - description: Search by name/markdown
        name: search
        in: query
        schema:
          type: string
      - description: Page size
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      - description: "Sort by field (DISTANCE, ELEVATION_GAIN, HILLINESS, DATE_TIME)"
        name: sortBy
        in: query
        schema:
          $ref: "#/components/schemas/RouteSortBy"
      - description: "Sort direction (ASC, DESC)"
        name: sortDir
        in: query
        schema:
          $ref: "#/components/schemas/SortDirection"
      - description: Filter by surface type
        name: surfaceType
        in: query
        schema:
          $ref: "#/components/schemas/SurfaceType"
      - description: Filter by wind direction
        name: windDirection
        in: query
        schema:
          $ref: "#/components/schemas/WindDirection"
      responses:
        "200":
          description: Routes retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteListResponse"
  /api/teams:
    get:
      summary: List public teams
      description: Get a paginated list of public teams with optional search
      operationId: listTeams
      tags:
      - Teams
      parameters:
      - description: Minimum role in team
        name: minRole
        in: query
        schema:
          $ref: "#/components/schemas/MinRole"
      - description: Page number (0-indexed)
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - description: Search query to filter teams by name
        name: search
        in: query
        schema:
          type: string
      - description: Page size
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Teams retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResponse"
    post:
      summary: Create team
      description: Create a new team. The current user will be set as the team owner.
      operationId: createTeam
      tags:
      - Teams
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamRequest"
        required: true
      responses:
        "201":
          description: Team created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetailDto"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - user
  /api/teams/{teamSlug}:
    put:
      summary: Update team
      description: Update team information. Requires ADMIN role.
      operationId: updateTeam
      tags:
      - Teams
      parameters:
      - description: Team URL slug
        name: teamSlug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamRequest"
        required: true
      responses:
        "200":
          description: Team updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetailDto"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not a team admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - SecurityScheme:
        - user
    get:
      summary: Get team by slug
      description: Get detailed team information by URL slug
      operationId: getTeam
      tags:
      - Teams
      parameters:
      - description: Team URL slug
        name: teamSlug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Team retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetailDto"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Team is private and user is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete team
      description: Soft delete a team. Requires OWNER role.
      operationId: deleteTeam
      tags:
      - Teams
      parameters:
      - description: Team URL slug
        name: teamSlug
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Team deleted successfully
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not the team owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - SecurityScheme:
        - user
  /api/teams/{teamSlug}/ads:
    get:
      summary: List ads
      description: Get paginated list of ads for a team with optional filtering
      operationId: listAds
      tags:
      - Ads
      parameters:
      - description: Team URL slug
        name: teamSlug
        in: path
        required: true
        schema:
          type: string
      - description: Filter by ad type
        name: adType
        in: query
        schema:
          $ref: "#/components/schemas/AdType"
      - description: Start date filter (ISO format)
        name: from
        in: query
        schema:
          type: string
      - description: Page number
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - description: Search by name/description
        name: search
        in: query
        schema:
          type: string
      - description: Page size
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      - description: End date filter (ISO format)
        name: to
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Ads retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdListResponse"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - user
    post:
      summary: Create ad
      description: Create a new ad. Any team member can create ads.
      operationId: createAd
      tags:
      - Ads
      parameters:
      - description: Team URL slug
        name: teamSlug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdRequest"
        required: true
      responses:
        "201":
          description: Ad created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdDto"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not a team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - SecurityScheme:
        - user
  /api/teams/{teamSlug}/ads/{slug}:
    put:
      summary: Update ad
      description: Update ad information. Only the creator or an admin can update.
      operationId: updateAd
      tags:
      - Ads
      parameters:
      - description: Ad URL slug
        name: slug
        in: path
        required: true
        schema:
          type: string
      - description: Team URL slug
        name: teamSlug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdRequest"
        required: true
      responses:
        "200":
          description: Ad updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdDto"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not authorized to update this ad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Team or ad not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - SecurityScheme:
        - user
    get:
      summary: Get ad details
      description: Get detailed ad information
      operationId: getAd
      tags:
      - Ads
      parameters:
      - description: Ad URL slug
        name: slug
        in: path
        required: true
        schema:
          type: string
      - description: Team URL slug
        name: teamSlug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ad retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdDto"
        "404":
          description: Team or ad not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - user
    delete:
      summary: Delete ad
      description: Soft delete an ad. Only the creator or an admin can delete.
      operationId: deleteAd
      tags:
      - Ads
      parameters:
      - description: Ad URL slug
        name: slug
        in: path
        required: true
        schema:
          type: string
      - description: Team URL slug
        name: teamSlug
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Ad deleted successfully
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not authorized to delete this ad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Team or ad not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - SecurityScheme:
        - user
  /api/teams/{teamSlug}/ads/{slug}/slug:
    patch:
      summary: Change ad slug
      description: Change ad URL slug. Requires admin permissions.
      operationId: changeAdSlug
      tags:
      - Ads
      parameters:
      - description: Current ad URL slug
        name: slug
        in: path
        required: true
        schema:
          type: string
      - description: Team URL slug
        name: teamSlug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlugChangeRequest"
        required: true
      responses:
        "200":
          description: Slug changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdDto"
        "400":
          description: Invalid slug format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not authorized to change this ad's slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Team or ad not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - SecurityScheme:
        - user
  /api/teams/{teamSlug}/assets:
    post:
      summary: Create asset
      operationId: uploadAsset
      tags:
      - Assets
      parameters:
      - description: Team URL slug
        name: teamSlug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
        required: true
      responses:
        "201":
          description: Asset created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDto"
        "400":
          description: Invalid request or file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not a team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - SecurityScheme:
        - user
  /api/teams/{teamSlug}/members:
    get:
      summary: Get team members
      description: Get paginated list of team members
      operationId: getMembers
      tags:
      - Team Members
      parameters:
      - description: Team URL slug
        name: teamSlug
        in: path
        required: true
        schema:
          type: string
      - description: Page number
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - description: Page size
        name: size
        in: query
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          description: Members retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - user
    post:
      summary: Add team member
      description: Add a member to the team. Requires ADMIN role on team.
      operationId: addMember
      tags:
      - Team Members
      parameters:
      - description: Team URL slug
        name: teamSlug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
        required: true
      responses:
        "201":
          description: Member added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDto"
        "400":
          description: Invalid request or user already a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not a team admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Team or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - SecurityScheme:
        - user
  /api/teams/{teamSlug}/members/join:
    post:
      summary: Join team
      description: Request to join a team
      operationId: joinTeam
      tags:
      - Team Members
      parameters:
      - description: Team URL slug
        name: teamSlug
        in: path
        required: true
        schema:
          type: string
      responses:
        "201":
          description: Successfully joined team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDto"
        "400":
          description: Team is full or user is already a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - user
  /api/teams/{teamSlug}/members/leave:
    post:
      summary: Leave team
      description: Leave a team
      operationId: leaveTeam
      tags:
      - Team Members
      parameters:
      - description: Team URL slug
        name: teamSlug
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Successfully left team
        "400":
          description: Cannot leave - user is the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Team not found or user is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - user
  /api/teams/{teamSlug}/members/{memberId}:
    put:
      summary: Update member role
      description: Update a team member's role. Requires ADMIN role.
      operationId: updateMemberRole
      tags:
      - Team Members
      parameters:
      - description: Member user ID (TSID)
        name: memberId
        in: path
        required: true
        schema:
          type: string
      - description: Team URL slug
        name: teamSlug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleRequest"
        required: true
      responses:
        "200":
          description: Role updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDto"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not a team admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Team or member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - SecurityScheme:
        - user
    delete:
      summary: Remove team member
      description: Remove a member from the team. Requires ADMIN role.
      operationId: removeMember
      tags:
      - Team Members
      parameters:
      - description: Member user ID (TSID)
        name: memberId
        in: path
        required: true
        schema:
          type: string
      - description: Team URL slug
        name: teamSlug
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Member removed successfully
        "401":
          description: Unauthorized
          content:
            application/json:
