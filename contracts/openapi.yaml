---
openapi: 3.1.0
components:
  schemas:
    AdDto:
      description: Ad data
      type: object
      required:
      - team
      - id
      - slug
      - name
      - media
      - status
      - visibility
      - adType
      - createdAt
      - updatedAt
      - createdById
      properties:
        team:
          description: Team
          type: object
          $ref: "#/components/schemas/TeamPublicationDto"
        id:
          type: string
          description: Ad ID (TSID)
        slug:
          type: string
          description: Ad URL slug
        name:
          type: string
          description: Ad name
        media:
          description: Ad media
          type: object
          $ref: "#/components/schemas/MediaDto"
        status:
          description: Ad status
          type: string
          $ref: "#/components/schemas/Status"
        visibility:
          description: Visibility level
          type: string
          $ref: "#/components/schemas/Visibility"
        adType:
          description: Ad type
          type: string
          $ref: "#/components/schemas/AdType"
        price:
          type: number
          description: Price
        rentalPeriod:
          description: Rental period
          type: string
          $ref: "#/components/schemas/RentalPeriod"
        locationDescription:
          type: string
          description: Location description
        createdAt:
          description: Creation timestamp
          type: string
          $ref: "#/components/schemas/Instant"
        updatedAt:
          description: Creation timestamp
          type: string
          $ref: "#/components/schemas/Instant"
        createdById:
          type: string
          description: Creator ID (TSID)
    AdEditDto:
      description: Ad data
      type: object
      required:
      - team
      - id
      - slug
      - name
      - media
      - status
      - visibility
      - adType
      - createdAt
      - updatedAt
      - createdById
      properties:
        team:
          description: Team
          type: object
          $ref: "#/components/schemas/TeamPublicationDto"
        id:
          type: string
          description: Ad ID (TSID)
        slug:
          type: string
          description: Ad URL slug
        name:
          type: string
          description: Ad name
        media:
          description: Ad media
          type: object
          $ref: "#/components/schemas/MediaDto"
        status:
          description: Ad status
          type: string
          $ref: "#/components/schemas/Status"
        visibility:
          description: Visibility level
          type: string
          $ref: "#/components/schemas/Visibility"
        adType:
          description: Ad type
          type: string
          $ref: "#/components/schemas/AdType"
        price:
          type: number
          description: Price
        rentalPeriod:
          description: Rental period
          type: string
          $ref: "#/components/schemas/RentalPeriod"
        locationGeometry:
          description: "Location coordinates [longitude, latitude]"
          type: object
          required:
          - type
          - coordinates
          properties:
            type:
              type: string
              examples:
              - Point
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: double
              description: "Coordinates [longitude, latitude]"
              examples:
              - - 2.3522
                - 48.8566
        locationDescription:
          type: string
          description: Location description
        createdAt:
          description: Creation timestamp
          type: string
          $ref: "#/components/schemas/Instant"
        updatedAt:
          description: Creation timestamp
          type: string
          $ref: "#/components/schemas/Instant"
        createdById:
          type: string
          description: Creator ID (TSID)
    AdListResponse:
      description: Paginated ad list response
      type: object
      required:
      - ads
      - total
      - page
      - size
      properties:
        ads:
          type: array
          items:
            $ref: "#/components/schemas/AdDto"
          description: List of ads
        total:
          type: integer
          format: int64
          description: Total number of ads
        page:
          type: integer
          format: int32
          description: Current page number
        size:
          type: integer
          format: int32
          description: Page size
    AdRequest:
      description: Ad request
      type: object
      required:
      - name
      - media
      - status
      - adType
      properties:
        name:
          type: string
          description: Ad name
          pattern: \S
          minLength: 1
          maxLength: 200
        media:
          description: Ad description
          type: object
          $ref: "#/components/schemas/MediaDto"
        status:
          description: Ad status
          type: string
          $ref: "#/components/schemas/Status"
        adType:
          description: Ad type
          type: string
          $ref: "#/components/schemas/AdType"
        price:
          type: number
          description: "Price (optional, null for 'contact for price')"
        rentalPeriod:
          description: Rental period (required for RENTAL type)
          type: string
          $ref: "#/components/schemas/RentalPeriod"
        locationDescription:
          type: string
          description: Location description
          maxLength: 200
        locationGeometry:
          description: "Location coordinates [longitude, latitude]"
          type: object
          required:
          - type
          - coordinates
          properties:
            type:
              type: string
              examples:
              - Point
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: double
              description: "Coordinates [longitude, latitude]"
              examples:
              - - 2.3522
                - 48.8566
    AdType:
      type: string
      enum:
      - SALE
      - RENTAL
      - WANTED
    AddMemberRequest:
      description: Request to add a member to the team
      type: object
      required:
      - userId
      properties:
        userId:
          type: string
          description: User ID (TSID) to add
          examples:
          - 0h4a8xzk8jv80
        role:
          description: Role to assign (defaults to MEMBER)
          type: string
          $ref: "#/components/schemas/TeamRole"
    AdminDomainDto:
      description: Admin domain view with statistics
      type: object
      required:
      - id
      - domain
      - name
      - baseUrl
      - singleTeam
      - active
      - teamCount
      - userCount
      - createdAt
      properties:
        id:
          type: string
          description: Domain ID (TSID)
          examples:
          - 0h4a8xzk8jv80
        domain:
          type: string
          description: Domain hostname
        name:
          type: string
          description: Domain display name
        baseUrl:
          type: string
          description: Base URL for the domain
        singleTeam:
          type: boolean
          description: Whether domain is single-team mode
        active:
          type: boolean
          description: Whether domain is active
        teamCount:
          type: integer
          format: int64
          description: Number of teams in this domain
        userCount:
          type: integer
          format: int64
          description: Number of users in this domain
        createdAt:
          description: Domain creation timestamp
          type: string
          $ref: "#/components/schemas/Instant"
    AdminDomainListResponse:
      description: Paginated admin domain list response
      type: object
      required:
      - domains
      - total
      - page
      - size
      properties:
        domains:
          type: array
          items:
            $ref: "#/components/schemas/AdminDomainDto"
          description: List of domains
        total:
          type: integer
          format: int64
          description: Total number of domains
        page:
          type: integer
          format: int32
          description: Current page number
        size:
          type: integer
          format: int32
          description: Page size
    AdminStatsDto:
      description: Admin dashboard statistics
      type: object
      required:
      - totalDomains
      - totalTeams
      - totalUsers
      properties:
        totalDomains:
          type: integer
          format: int64
          description: Total number of domains
        totalTeams:
          type: integer
          format: int64
          description: Total number of teams
        totalUsers:
          type: integer
          format: int64
          description: Total number of users
    AdminTeamDto:
      description: Admin team view with domain info
      type: object
      required:
      - id
      - name
      - slug
      - domainId
      - domainName
      - visibility
      - deleted
      - memberCount
      - createdAt
      properties:
        id:
          type: string
          description: Team ID (TSID)
          examples:
          - 0h4a8xzk8jv80
        name:
          type: string
          description: Team name
        slug:
          type: string
          description: Team URL slug
        domainId:
          type: string
          description: Domain ID this team belongs to
        domainName:
          type: string
          description: Domain hostname
        visibility:
          description: Team visibility
          type: string
          $ref: "#/components/schemas/Visibility"
        deleted:
          type: boolean
          description: Is team soft-deleted
        memberCount:
          type: integer
          format: int64
          description: Number of members
        createdAt:
          description: Team creation timestamp
          type: string
          $ref: "#/components/schemas/Instant"
    AdminTeamListResponse:
      description: Paginated admin team list response
      type: object
      required:
      - teams
      - total
      - page
      - size
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/AdminTeamDto"
          description: List of teams
        total:
          type: integer
          format: int64
          description: Total number of teams
        page:
          type: integer
          format: int32
          description: Current page number
        size:
          type: integer
          format: int32
          description: Page size
    AdminUserDto:
      description: Admin user view with domain info
      type: object
      required:
      - id
      - email
      - displayName
      - domainId
      - domainName
      - emailVerified
      - createdAt
      properties:
        id:
          type: string
          description: User ID (TSID)
          examples:
          - 0h4a8xzk8jv80
        email:
          type: string
          description: User email address
        displayName:
          type: string
          description: User display name
        domainId:
          type: string
          description: Domain ID this user belongs to
        domainName:
          type: string
          description: Domain hostname
        platformRole:
          description: Platform role (null if regular user)
          type: string
          $ref: "#/components/schemas/PlatformRole"
        emailVerified:
          type: boolean
          description: Whether email is verified
        createdAt:
          description: User creation timestamp
          type: string
          $ref: "#/components/schemas/Instant"
        lastLoginAt:
          description: Last login timestamp
          type: string
          $ref: "#/components/schemas/Instant"
    AdminUserListResponse:
      description: Paginated admin user list response
      type: object
      required:
      - users
      - total
      - page
      - size
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserDto"
          description: List of users
        total:
          type: integer
          format: int64
          description: Total number of users
        page:
          type: integer
          format: int32
          description: Current page number
        size:
          type: integer
          format: int32
          description: Page size
    AssetDimensionsDto:
      type: object
      properties:
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
    AssetDto:
      type: object
      required:
      - id
      - fileName
      - contentType
      - url
      properties:
        id:
          type: string
          description: ID (TSID)
        fileName:
          type: string
          description: Filename
        contentType:
          type: string
          description: Content-Type
        url:
          type: string
          description: url
        imageUrl:
          type: string
          description: image template url
        imageDimensions:
          description: image dimensions
          type: object
          $ref: "#/components/schemas/AssetDimensionsDto"
    AssetsDto:
      type: object
      properties:
        logo:
          description: Logo
          type: object
          $ref: "#/components/schemas/AssetDto"
        images:
          type: array
          items:
            $ref: "#/components/schemas/AssetDto"
          description: Images
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AssetDto"
          description: Attachments
        originalGpx:
          description: Original GPX
          type: object
          $ref: "#/components/schemas/AssetDto"
        gpx:
          description: GPX
          type: object
          $ref: "#/components/schemas/AssetDto"
        fit:
          description: FIT
          type: object
          $ref: "#/components/schemas/AssetDto"
        thumbnail:
          description: Thumbnail
          type: object
          $ref: "#/components/schemas/AssetDto"
      required:
      - images
      - attachments
    AssignPlatformRoleRequest:
      description: Request to assign or remove platform role
      type: object
      properties:
        role:
          description: Platform role to assign (null to remove)
          type: string
          $ref: "#/components/schemas/PlatformRole"
    AuthResponse:
      description: Authentication response
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        expiresIn:
          type: integer
          format: int32
          description: Token expiry in seconds
        user:
          description: Authenticated user
          type: object
          $ref: "#/components/schemas/UserDto"
    CalendarEventDto:
      description: Calendar event data
      type: object
      required:
      - id
      - title
      - start
      - allDay
      - type
      - teamSlug
      - teamName
      - entitySlug
      properties:
        id:
          type: string
          description: Event ID (TSID)
        title:
          type: string
          description: Event title
        start:
          description: Event start date/time
          type: string
          $ref: "#/components/schemas/Instant"
        end:
          description: Event end date/time
          type: string
          $ref: "#/components/schemas/Instant"
        allDay:
          type: boolean
          description: Is all-day event
        type:
          description: Event type
          type: string
          $ref: "#/components/schemas/CalendarEventType"
        teamSlug:
          type: string
          description: Team slug
        teamName:
          type: string
          description: Team name
        entitySlug:
          type: string
          description: Entity slug (ride or stage)
        tripSlug:
          type: string
          description: Parent trip slug (for stages only)
    CalendarEventType:
      type: string
      enum:
      - RIDE
      - TRIP_STAGE
    CalendarEventsResponse:
      description: Calendar events response
      type: object
      required:
      - events
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEventDto"
          description: List of calendar events
    CalendarTokenDto:
      description: Calendar token information
      type: object
      required:
      - token
      - globalFeedUrl
      - teamFeedUrlTemplate
      properties:
        token:
          type: string
          description: ICS feed token (include in URL)
        globalFeedUrl:
          type: string
          description: Global ICS feed URL
        teamFeedUrlTemplate:
          type: string
          description: Team-specific feed URL template
    CallbackResponse:
      description: OAuth callback response with redirect URL
      type: object
      required:
      - redirectUrl
      properties:
        redirectUrl:
          type: string
          description: Redirect URL with auth code
    ClimbCategory:
      type: string
      enum:
      - HC
      - CAT1
      - CAT2
      - CAT3
      - CAT4
    ClimbDto:
      description: Climb segment information
      type: object
      required:
      - startDistance
      - endDistance
      - elevationGain
      - averageGradient
      - maxGradient
      properties:
        startDistance:
          type: integer
          format: int32
          description: Start distance from route start in meters
        endDistance:
          type: integer
          format: int32
          description: End distance from route start in meters
        elevationGain:
          type: integer
          format: int32
          description: Elevation gain in meters
        averageGradient:
          type: number
          description: Average gradient percentage
        maxGradient:
          type: number
          description: Maximum gradient percentage
        category:
          description: "Climb category (HC, 1, 2, 3, 4)"
          type: string
          $ref: "#/components/schemas/ClimbCategory"
    CommentDto:
      description: Comment data
      type: object
      required:
      - id
      - content
      - author
      - createdAt
      - replies
      properties:
        id:
          type: string
          description: Comment ID (TSID)
        content:
          type: string
          description: Comment content
        author:
          description: Comment author
          type: object
          $ref: "#/components/schemas/PublicUserDto"
        createdAt:
          description: Creation timestamp
          type: string
          $ref: "#/components/schemas/Instant"
        parentId:
          type: string
          description: Parent comment ID (for replies)
        replies:
          type: array
          items:
            $ref: "#/components/schemas/CommentDto"
          description: Replies to this comment
    CommentListResponse:
      description: List of comments response
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommentDto"
          description: "List of comments (top-level only, with nested replies)"
        total:
          type: integer
          format: int32
          description: Total count including replies
    CommentRequest:
      description: Comment creation request
      type: object
      required:
      - content
      properties:
        content:
          type: string
          description: Comment content
          pattern: \S
          maxLength: 5000
        parentId:
          type: string
          description: Parent comment ID for replies (optional)
    ConfigDto:
      description: Application configuration
      type: object
      required:
      - webAuthnRpId
      - appName
      - singleTeam
      properties:
        webAuthnRpId:
          type: string
          description: WebAuthn Relying Party ID (domain)
        appName:
          type: string
          description: Application name
        singleTeam:
          type: boolean
          description: Single team mode - team creation disabled
    CreateDomainRequest:
      description: Request to create a new domain
      type: object
      required:
      - domain
      - name
      - baseUrl
      properties:
        domain:
          type: string
          description: Domain hostname
          pattern: \S
          maxLength: 250
        name:
          type: string
          description: Domain display name
          pattern: \S
          maxLength: 250
        baseUrl:
          type: string
          description: Base URL for the domain
          pattern: \S
          maxLength: 500
        singleTeam:
          type: boolean
          description: Whether domain is single-team mode
    EntityType:
      type: string
      enum:
      - TEAM
      - USER
      - USER_TEAM
      - RIDE_TEMPLATE
      - RIDE_TEMPLATE_GROUP
      - PLACE
      - COMMENT
      - ASSET
      - TRIP
      - TRIP_STAGE
      - ROUTE
      - RIDE
      - RIDE_GROUP
      - AD
      - POST
      - TEAM_PAGE
      - CALENDAR
      - PUBLICATION
      - ANY
    ErrorCode:
      type: string
      enum:
      - BAD_REQUEST
      - NOT_FOUND
      - UNAUTHORIZED
      - FORBIDDEN
      - INTERNAL_ERROR
      - UNKNOWN
      - VALIDATION
      - BUSINESS_RULE
      - LAST_ADMIN
      - ALREADY_REGISTERED
      - NOT_REGISTERED
      - INVALID_SLUG
      - SLUG_TAKEN
      - USER_NOT_SYNCED
      - GROUP_FULL
      - INVALID_VISIBILITY
      - PUBLIC_TRIP_PRIVATE_ROUTE
      - GPX_FAILURE
      - FILE_REQUIRED
      - TOO_MANY_TEAM_PAGES
      - GPX_EMPTY
      - INVALID_FORMAT
      - RENTAL_PERIOD_MISSING
      - STATUS_INVALID
      - PUBLIC_RIDE_PRIVATE_ROUTE
      - INVALID_CREDENTIALS
      - EMAIL_NOT_VERIFIED
      - EMAIL_ALREADY_EXISTS
      - TOKEN_INVALID
      - TOKEN_EXPIRED
      - SESSION_EXPIRED
      - PASSWORD_NOT_SET
      - PASSKEY_NOT_FOUND
      - USER_NOT_FOUND
      - DOMAIN_NOT_FOUND
      - TEAM_NOT_FOUND
      - TEAM_CREATION_DISABLED
      - GPS_SERVICE_ALREADY_CONNECTED
      - GPS_SERVICE_NOT_CONNECTED
      - GPS_SERVICE_NOT_CONFIGURED
      - GPS_INVALID_STATE
      - GPS_STATE_EXPIRED
      - GPX_NOT_FOUND
    ErrorDetails:
      oneOf:
      - $ref: "#/components/schemas/ErrorValidationDetails"
      - $ref: "#/components/schemas/NotFoundDetails"
      description: Error details
      discriminator:
        propertyName: type
        mapping:
          VALIDATION: "#/components/schemas/ErrorValidationDetails"
          NOT_FOUND: "#/components/schemas/NotFoundDetails"
      type: object
      properties:
        type:
          $ref: "#/components/schemas/ErrorCode"
    ErrorResponse:
      description: Error response
      type: object
      required:
      - code
      properties:
        code:
          description: Error code
          type: string
          $ref: "#/components/schemas/ErrorCode"
        errorDetails:
          description: Additional details
          type: object
          $ref: "#/components/schemas/ErrorDetails"
    ErrorValidationDetails:
      type: object
      required:
      - type
      - fieldErrors
      properties:
        type:
          description: Type
          type: string
          $ref: "#/components/schemas/ErrorCode"
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
          description: Field Errors
    FieldError:
      type: object
      required:
      - field
      - message
      - rejectedValue
      properties:
        field:
          type: string
          description: Field
        message:
          type: string
          description: Message
        rejectedValue:
          description: Rejected value
    GarminCallbackRequest:
      description: Garmin OAuth callback from frontend
      type: object
      required:
      - accessToken
      - redirectUri
      properties:
        accessToken:
          type: string
          description: User's access token from frontend auth
          pattern: \S
        redirectUri:
          type: string
          description: Original redirect URI from authorize request
          pattern: \S
        state:
          type: string
          description: State parameter from authorize request
    GarminRouteDto:
      description: Route information for Garmin device
      type: object
      required:
      - teamSlug
      - routeSlug
      - name
      - distance
      - elevationGain
      properties:
        teamSlug:
          type: string
          description: Team slug
        routeSlug:
          type: string
          description: Route slug
        name:
          type: string
          description: Route name
        label:
          type: string
          description: "Label (e.g., 'Rapides - Sam 18 Jan 09:00')"
        rideDateTime:
          description: Ride date/time if from a ride
          type: string
          $ref: "#/components/schemas/Instant"
        distance:
          type: number
          format: float
          description: Distance in meters
        elevationGain:
          type: number
          format: float
          description: Elevation gain in meters
        startLat:
          type: number
          format: double
          description: Start latitude
        startLon:
          type: number
          format: double
          description: Start longitude
        distanceFromUser:
          type: number
          format: double
          description: Distance from user in meters (if GPS provided)
    GarminRoutesResponse:
      description: List of routes for Garmin device
      type: object
      required:
      - routes
      properties:
        routes:
          type: array
          items:
            $ref: "#/components/schemas/GarminRouteDto"
          description: Routes list
    GarminTokenRequest:
      description: Garmin OAuth token exchange request
      type: object
      required:
      - grantType
      properties:
        grantType:
          type: string
          description: Grant type (authorization_code or refresh_token)
          pattern: \S
        code:
          type: string
          description: Authorization code (for authorization_code grant)
        refreshToken:
          type: string
          description: Refresh token (for refresh_token grant)
    GarminTokenResponse:
      description: Garmin OAuth token response
      type: object
      required:
      - accessToken
      - tokenType
      - expiresIn
      properties:
        accessToken:
          type: string
          description: Access token
        tokenType:
          type: string
          description: Token type (always 'Bearer')
        expiresIn:
          type: integer
          format: int32
          description: Token expiry in seconds
        refreshToken:
          type: string
          description: Refresh token
    GeoJsonLineString:
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          enum:
          - LineString
        coordinates:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
          description: "Array of [lon, lat] coordinates"
    GeoJsonPoint:
      description: "Location coordinates [longitude, latitude]"
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          examples:
          - Point
          enum:
          - Point
        coordinates:
          type: array
          items:
            type: number
            format: double
          description: "Coordinates [longitude, latitude]"
          examples:
          - - 2.3522
            - 48.8566
    GeoPoint:
      type: object
      required:
      - lng
      - lat
      properties:
        lng:
          type: number
          format: double
        lat:
          type: number
          format: double
    GpsOAuthUrlResponse:
      description: OAuth authorization URL response
      type: object
      required:
      - authorizationUrl
      properties:
        authorizationUrl:
          type: string
          description: URL to redirect user for OAuth authorization
