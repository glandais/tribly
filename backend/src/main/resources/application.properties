# Tribly Backend Configuration

# Application
quarkus.application.name=tribly-backend
quarkus.http.port=8080

quarkus.http.limits.max-body-size=100M

quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true

%test.quarkus.devservices.enabled=true

# GPX storage paths
%dev.tribly.data.cache=/tmp/tribly-data-cache-dev
%dev.gpx.storage.path=data/gpx

%test.tribly.data.cache=/tmp/tribly-data-cache-test
%test.gpx.storage.path=/tmp/tribly-data-gpx-test

# File upload configuration
%test.quarkus.http.body.uploads-directory=/tmp/tribly-uploads-test

# ===========================================
# Tribly Frontend Configuration (served via /api/config)
# ===========================================

# Keycloak settings for frontend
%dev.tribly.keycloak.url=http://localhost:8180
%dev.tribly.keycloak.realm=quarkus
%dev.tribly.keycloak.client-id=tribly-frontend

%prod.tribly.keycloak.url=${KEYCLOAK_URL:http://localhost:8180}
%prod.tribly.keycloak.realm=${KEYCLOAK_REALM:tribly}
%prod.tribly.keycloak.client-id=${KEYCLOAK_FRONTEND_CLIENT_ID:tribly-frontend}

%test.tribly.keycloak.url=http://localhost:8180
%test.tribly.keycloak.realm=quarkus
%test.tribly.keycloak.client-id=tribly-frontend

# Map settings
tribly.map.tile-url=https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
tribly.map.attribution=&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgis/postgis:16-3.4-alpine
# Production/Dev database settings (tests use DevServices)
%prod.quarkus.datasource.username=${POSTGRES_USER:tribly}
%prod.quarkus.datasource.password=${POSTGRES_PASSWORD:tribly_dev_password}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tribly}

%dev.quarkus.datasource.username=tribly
%dev.quarkus.datasource.password=tribly_dev_password
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/tribly

# Hibernate ORM
quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL:false}
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.schema-management.halt-on-error=true

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.locations=db/migration

# ===========================================
# OIDC/Keycloak Configuration
# ===========================================

# Application type: service for bearer token validation (SPA architecture)
quarkus.oidc.application-type=service

# Enable proactive auth to ensure SecurityIdentityAugmentor is always applied
# This fixes the issue where @PermitAll endpoints don't receive augmented identity
quarkus.http.auth.proactive=true

# Client configuration
quarkus.oidc.client-id=tribly-backend

# Dev profile - use docker-compose Keycloak (disable Dev Services)
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/quarkus

# Test profile - use Dev Services for isolated testing
%test.quarkus.keycloak.devservices.realm-path=keycloak/quarkus-realm.json

# Production profile
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/tribly
%prod.quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET}

# ===========================================
# OIDC tenant "download" (cookie-based)
# ===========================================
quarkus.oidc.download.application-type=web-app
quarkus.oidc.download.client-id=tribly-backend
quarkus.oidc.download.token-state-manager.strategy=id-refresh-tokens

# Dev profile uses docker-compose Keycloak
%dev.quarkus.oidc.download.auth-server-url=http://localhost:8180/realms/quarkus

# Test profile uses Dev Services - inherit from default tenant
%test.quarkus.oidc.download.auth-server-url=${quarkus.oidc.auth-server-url}

# Production profile
%prod.quarkus.oidc.download.auth-server-url=${KEYCLOAK_URL}/realms/tribly

# Cookie settings
quarkus.oidc.download.authentication.cookie-path=/api/download/team
quarkus.oidc.download.authentication.cookie-same-site=lax
quarkus.oidc.download.authentication.session-age-extension=30M

# Download endpoints use method-level security (@PermitAll or @RolesAllowed)
# Policy set to permit to allow @PermitAll endpoints to work for anonymous users
quarkus.http.auth.permission.download.paths=/api/download/team/*
quarkus.http.auth.permission.download.policy=authenticated


# CORS Configuration
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:8180}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,X-Requested-With
quarkus.http.cors.exposed-headers=Location,X-Total-Count
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# OpenAPI
quarkus.smallrye-openapi.info-title=Tribly API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API for Tribly Cycling Team Management Platform
quarkus.swagger-ui.always-include=true

quarkus.smallrye-openapi.store-schema-directory=../contracts
mp.openapi.extensions.smallrye.operationIdStrategy=METHOD
quarkus.smallrye-openapi.oidc-open-id-connect-url=http://localhost:8180/realms/tribly/.well-known/openid-configuration

# Logging
quarkus.log.console.enabled=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.level=INFO
quarkus.log.category."com.tribly".level=${LOG_LEVEL:INFO}
quarkus.log.category."org.hibernate.SQL".level=${HIBERNATE_LOG_SQL:WARN}
quarkus.log.category."org.hibernate.tool.schema".level=INFO

# Dev profile overrides
%dev.quarkus.log.category."com.tribly".level=DEBUG
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.live-reload.instrumentation=true

# Logging
%test.quarkus.log.category."com.tribly".level=DEBUG
