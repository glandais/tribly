# Brevo transactional email (disabled by default, SMTP/Mailhog used instead)
# The content of every one of these templates lives in TWO places: here as a Brevo template ID, and
# in src/main/resources/templates/mail/<name>.<lang>.{html,txt}, which is what the SMTP fallback
# renders. Editing one without the other makes the local mail and the production mail diverge.
# Template IDs: email-verification-fr=2, email-verification-en=3, otp-fr=4, otp-en=5, password-reset-fr=6, password-reset-en=7, data-export-fr=8, data-export-en=9, ad-contact-fr=10, ad-contact-en=11, team-invitation-fr=12, team-invitation-en=13, team-invitation-signup-fr=14, team-invitation-signup-en=15
quarkus.rest-client.brevo.url=https://api.brevo.com
pedalons.email.brevo.enabled=false

# to test Brevo emails locally
# %dev.pedalons.email.brevo.enabled=true
# %dev.pedalons.email.brevo.api-key=${BREVO_API_KEY}
# %dev.pedalons.email.brevo.templates.email-verification.fr=2
# %dev.pedalons.email.brevo.templates.email-verification.en=3
# %dev.pedalons.email.brevo.templates.otp.fr=4
# %dev.pedalons.email.brevo.templates.otp.en=5
# %dev.pedalons.email.brevo.templates.password-reset.fr=6
# %dev.pedalons.email.brevo.templates.password-reset.en=7
# %dev.pedalons.email.brevo.templates.data-export.fr=8
# %dev.pedalons.email.brevo.templates.data-export.en=9
# %dev.pedalons.email.brevo.templates.ad-contact.fr=10
# %dev.pedalons.email.brevo.templates.ad-contact.en=11
# %dev.pedalons.email.brevo.templates.team-invitation.fr=12
# %dev.pedalons.email.brevo.templates.team-invitation.en=13
# %dev.pedalons.email.brevo.templates.team-invitation-signup.fr=14
# %dev.pedalons.email.brevo.templates.team-invitation-signup.en=15

%prod.pedalons.email.brevo.enabled=true
%prod.pedalons.email.brevo.api-key=${BREVO_API_KEY}
%prod.pedalons.email.brevo.templates.email-verification.fr=2
%prod.pedalons.email.brevo.templates.email-verification.en=3
%prod.pedalons.email.brevo.templates.otp.fr=4
%prod.pedalons.email.brevo.templates.otp.en=5
%prod.pedalons.email.brevo.templates.password-reset.fr=6
%prod.pedalons.email.brevo.templates.password-reset.en=7
%prod.pedalons.email.brevo.templates.data-export.fr=8
%prod.pedalons.email.brevo.templates.data-export.en=9
# The ad-contact templates take the params the relay passes: appName, recipientName, senderName,
# adName, adUrl, message. They must not print the sender's address — it travels in Reply-To and
# nowhere else, which is what lets the author answer without the address ever being published.
%prod.pedalons.email.brevo.templates.ad-contact.fr=10
%prod.pedalons.email.brevo.templates.ad-contact.en=11
# The two invitation templates take the same params — appName, inviterName, teamName,
# invitationUrl, expiresInDays — and differ only in wording: one tells the reader they already have
# an account, the other that they need to create one. Two templates rather than one with a flag,
# because Brevo templates have no conditionals. The role is deliberately not a param: translating it
# would mean a second copy of the clients' roles.* table, in Java, in two languages.
%prod.pedalons.email.brevo.templates.team-invitation.fr=12
%prod.pedalons.email.brevo.templates.team-invitation.en=13
%prod.pedalons.email.brevo.templates.team-invitation-signup.fr=14
%prod.pedalons.email.brevo.templates.team-invitation-signup.en=15

%dev.mp.jwt.verify.publickey.location=keys/publicKey.pem
%dev.smallrye.jwt.sign.key.location=keys/privateKey.pem

# ===========================================
# Test profile settings
# ===========================================
%test.quarkus.devservices.enabled=true
# Random test HTTP port so parallel Surefire forks don't collide on 8081
%test.quarkus.http.test-port=0
# Test DB is drop-and-create: durability is irrelevant, disable fsync at server level
%test.quarkus.datasource.devservices.init-script-path=init-test-db.sql
# Coverage instrumentation is opt-in: mvn test -Dcoverage=true -Dsurefire.forkCount=1
%test.quarkus.jacoco.enabled=${coverage:false}
%test.pedalons.data.cache=/tmp/pedalons-data-cache-test
%test.quarkus.rest-client.imgproxy.url=http://localhost:38080
%test.quarkus.rest-client.valhalla.url=http://localhost:8002
%test.tileserver.url=http://localhost:18080

# S3/MinIO (test) - overridden by MinioTestResource (testcontainer) on AbstractResourceTest
%test.quarkus.s3.endpoint-override=http://localhost:9000
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=pedalons
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=pedalons_secret
# Use Apache HTTP client in tests: URL connection client mishandles Expect: 100-continue against S3Mock (random "Unexpected end of file from server")
%test.quarkus.s3.sync-client.type=apache
%test.quarkus.http.body.uploads-directory=/tmp/pedalons-uploads-test
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.halt-on-error=true
%test.quarkus.hibernate-orm.log.sql=false
# Enable Hibernate Statistics in tests so QueryStats can count SQL statements per API call.
%test.quarkus.hibernate-orm.statistics=true
# Tests skip Flyway, so DB objects Hibernate doesn't create (route_mvt_row) are declared here
%test.quarkus.hibernate-orm.sql-load-script=import-test.sql
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.flyway.validate-on-migrate=false
%test.quarkus.log.category."fr.pedalons".level=INFO
%test.quarkus.scheduler.enabled=false
%test.pedalons.bootstrap.enabled=false

# Encryption key (test)
%test.pedalons.encryption.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# GPS Services (test)
%test.pedalons.gps.hammerhead.client-id=test-client-id
%test.pedalons.gps.hammerhead.client-secret=test-client-secret
%test.pedalons.gps.garmin.client-id=test-garmin-client-id

# Social login (test)
%test.pedalons.social.strava.client-id=test-strava-client-id
%test.pedalons.social.strava.client-secret=test-strava-client-secret
%test.pedalons.social.placeholder-email-domain=pedalons.fr
%test.quarkus.hibernate-orm.scripts.generation=create
%test.quarkus.hibernate-orm.scripts.generation.create-target=target/fresh.sql

# Auth (test)
%test.pedalons.auth.cookie.secure=false

# Mailer (test) - mock
%test.quarkus.mailer.mock=true

%test.mp.jwt.verify.publickey.location=keys/publicKey.pem
%test.smallrye.jwt.sign.key.location=keys/privateKey.pem

# GDPR self-service data export (DSAR)
# One export per user per hour: each one reads every object that user owns out of storage.
pedalons.export.cooldown-hours=1
# How long the emailed download link stays alive before the archive is deleted.
pedalons.export.expiry-days=7
# Hard ceiling on one archive (2 GiB). Past it the job fails cleanly instead of filling the disk.
pedalons.export.max-bytes=2147483648
# A PROCESSING row untouched for this long is assumed crashed and goes back on the queue.
pedalons.export.stuck-after-minutes=60
pedalons.export.max-attempts=3
# How long finished rows are kept, so the user can still see "my last export was on ...".
pedalons.export.history-days=90
# Where archives are assembled before upload. Defaults to ${java.io.tmpdir}/pedalons-exports;
# in prod that is the container overlay filesystem with no size cap, so point it at a volume
# (e.g. the existing ./data/cache mount) if users have large accounts.
# pedalons.export.temp-dir=/mnt/cache/exports
