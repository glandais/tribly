# Tribly Backend Configuration

# Application
quarkus.application.name=tribly-backend
quarkus.http.port=8080

# Database Configuration
quarkus.datasource.db-kind=postgresql
# Production/Dev database settings (tests use DevServices)
%prod.quarkus.datasource.username=${POSTGRES_USER:tribly}
%prod.quarkus.datasource.password=${POSTGRES_PASSWORD:tribly_dev_password}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tribly}
%dev.quarkus.datasource.username=${POSTGRES_USER:tribly}
%dev.quarkus.datasource.password=${POSTGRES_PASSWORD:tribly_dev_password}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tribly}

# Hibernate ORM
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL:false}
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# OIDC - Strava OAuth2
quarkus.oidc.enabled=false
# Strava doesn't support OIDC, we use custom OAuth2 implementation

# JWT Configuration
mp.jwt.verify.issuer=${JWT_ISSUER:https://tribly.app}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY:/keys/public.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY:/keys/private.pem}
smallrye.jwt.token.header=Authorization
smallrye.jwt.token.scheme=Bearer
smallrye.jwt.new-token.lifespan=86400
smallrye.jwt.new-token.issuer=${JWT_ISSUER:https://tribly.app}

# Strava OAuth2 Settings (custom implementation)
tribly.strava.client-id=${STRAVA_CLIENT_ID:}
tribly.strava.client-secret=${STRAVA_CLIENT_SECRET:}
tribly.strava.redirect-uri=${STRAVA_REDIRECT_URI:http://localhost:5173/auth/callback/strava}
tribly.strava.authorization-url=https://www.strava.com/oauth/authorize
tribly.strava.token-url=https://www.strava.com/oauth/token
tribly.strava.api-base-url=https://www.strava.com/api/v3

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,X-Requested-With,X-Team-Domain
quarkus.http.cors.exposed-headers=Location,X-Total-Count
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# OpenAPI
quarkus.smallrye-openapi.info-title=Tribly API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API for Tribly Cycling Team Management Platform
quarkus.swagger-ui.always-include=true

# Health checks
quarkus.health.extensions.enabled=true

# Logging
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.level=INFO
quarkus.log.category."com.tribly".level=${LOG_LEVEL:INFO}
quarkus.log.category."org.hibernate.SQL".level=${HIBERNATE_LOG_SQL:WARN}

# Dev profile overrides
%dev.quarkus.log.category."com.tribly".level=DEBUG
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.live-reload.instrumentation=true
%dev.mp.jwt.verify.publickey.location=dev/keys/public.pem
%dev.smallrye.jwt.sign.key.location=dev/keys/private.pem

# Test profile overrides - use Testcontainers for database
%test.quarkus.devservices.enabled=true
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.image-name=postgis/postgis:16-3.4-alpine
%test.quarkus.flyway.migrate-at-start=true
%test.tribly.strava.client-id=test-client-id
%test.tribly.strava.client-secret=test-client-secret
%test.mp.jwt.verify.publickey.location=dev/keys/public.pem
%test.smallrye.jwt.sign.key.location=dev/keys/private.pem
