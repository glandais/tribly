# Tribly Backend Configuration

# Application
quarkus.application.name=tribly-backend

# HTTP Configuration
quarkus.http.port=8080

quarkus.http.limits.max-body-size=100M
quarkus.http.limits.max-form-attribute-size=100M

quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-forwarded=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true

quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:8180}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,X-Requested-With
quarkus.http.cors.exposed-headers=Location,X-Total-Count
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# ===========================================
# Database Configuration
# ===========================================
quarkus.datasource.db-kind=postgresql

# Hibernate ORM
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.schema-management.halt-on-error=true

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.locations=db/migration

# ===========================================
# JWT/Auth Configuration
# ===========================================

# JWT Configuration
mp.jwt.verify.issuer=tribly
smallrye.jwt.new-token.issuer=tribly

# Auth configuration
tribly.auth.jwt.expiry-minutes=15
tribly.auth.refresh-token.expiry-days=30
tribly.auth.magic-link.expiry-minutes=15
tribly.auth.email-verification.expiry-hours=24

# WebAuthn/Passkeys configuration
tribly.auth.webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
tribly.auth.webauthn.rp-name=Tribly
tribly.auth.webauthn.origin=${WEBAUTHN_ORIGIN:http://localhost:5173}
tribly.auth.webauthn.challenge-expiry-minutes=5

# Cookie configuration
tribly.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
tribly.auth.cookie.same-site=strict

# App settings
tribly.app-name=Tribly

# Mapbox
mapbox.api.key=${MAPBOX_API_KEY}

# OpenAPI
quarkus.smallrye-openapi.info-title=Tribly API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API for Tribly Cycling Team Management Platform
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.store-schema-directory=../contracts
mp.openapi.extensions.smallrye.operationIdStrategy=METHOD
quarkus.smallrye-openapi.oidc-open-id-connect-url=http://localhost:8180/realms/quarkus/.well-known/openid-configuration
mp.openapi.scan.exclude.packages=org.geolatte.geom

# Logging
quarkus.log.console.enabled=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.level=INFO
quarkus.log.category."com.tribly".level=INFO
quarkus.log.category."org.hibernate.SQL".level=WARN
quarkus.log.category."org.hibernate.tool.schema".level=INFO

# Indexing
quarkus.index-dependency.geolatte.group-id=org.geolatte
quarkus.index-dependency.geolatte.artifact-id=geolatte-geom

# ===========================================
# Production profile settings
# All values must be provided via environment variables
# ===========================================

# Database
%prod.quarkus.datasource.username=${POSTGRES_USER}
%prod.quarkus.datasource.password=${POSTGRES_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
%prod.quarkus.datasource.reactive.url=postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}

# Storage
%prod.tribly.data.cache=${DATA_CACHE_PATH}
%prod.storage.path=${STORAGE_PATH}

# Services
%prod.quarkus.rest-client.imgproxy.url=${IMGPROXY_URL}
%prod.quarkus.rest-client.brouter.url=${BROUTER_URL}

# Base URL (for links in emails, calendars, etc.)
%prod.tribly.base-url=${BASE_URL}

# Auth configuration (production)
%prod.tribly.auth.webauthn.rp-id=${WEBAUTHN_RP_ID}
%prod.tribly.auth.webauthn.origin=${WEBAUTHN_ORIGIN}
%prod.tribly.auth.cookie.secure=true
%prod.mp.jwt.verify.publickey.location=/mnt/keys/publicKey.pem
%prod.smallrye.jwt.sign.key.location=/mnt/keys/privateKey.pem

# ===========================================
# Dev services
# ===========================================

quarkus.datasource.devservices.image-name=postgis/postgis:17-3.5-alpine

# ===========================================
# Dev profile settings
# ===========================================

%dev.tribly.data.cache=/tmp/tribly-data-cache-dev
%dev.storage.path=/home/glandais/code/perso/tribly/data/storage
%dev.quarkus.rest-client.imgproxy.url=http://localhost:38080
%dev.quarkus.rest-client.brouter.url=http://localhost:17777
%dev.quarkus.live-reload.instrumentation=true

%dev.quarkus.datasource.username=tribly
%dev.quarkus.datasource.password=tribly_dev_password
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/tribly
%dev.quarkus.datasource.reactive.url=postgresql://localhost:5432/tribly

%dev.quarkus.hibernate-orm.log.sql=true

# Auth (dev)
%dev.tribly.auth.webauthn.rp-id=localhost
%dev.tribly.auth.webauthn.origin=http://localhost:5173
%dev.tribly.auth.cookie.secure=false

# Mailer (dev) - Mailhog
%dev.quarkus.mailer.from=noreply@tribly.local
%dev.quarkus.mailer.host=localhost
%dev.quarkus.mailer.port=1025
%dev.quarkus.mailer.mock=false

%dev.mp.jwt.verify.publickey.location=keys/publicKey.pem
%dev.smallrye.jwt.sign.key.location=keys/privateKey.pem

# ===========================================
# Test profile settings
# ===========================================
%test.quarkus.devservices.enabled=true
%test.tribly.data.cache=/tmp/tribly-data-cache-test
%test.storage.path=/home/glandais/code/perso/tribly/data/storage
%test.quarkus.rest-client.imgproxy.url=http://localhost:38080
%test.quarkus.rest-client.brouter.url=http://localhost:17777
%test.quarkus.http.body.uploads-directory=/tmp/tribly-uploads-test
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.halt-on-error=true
%test.quarkus.hibernate-orm.log.sql=true
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.flyway.validate-on-migrate=false
%test.quarkus.log.category."com.tribly".level=DEBUG
%test.quarkus.scheduler.enabled=false
%test.quarkus.hibernate-orm.scripts.generation=create
%test.quarkus.hibernate-orm.scripts.generation.create-target=target/fresh.sql

# Auth (test)
%test.tribly.auth.webauthn.rp-id=localhost
%test.tribly.auth.webauthn.origin=http://localhost:5173
%test.tribly.auth.cookie.secure=false

# Mailer (test) - mock
%test.quarkus.mailer.mock=true

%test.mp.jwt.verify.publickey.location=keys/publicKey.pem
%test.smallrye.jwt.sign.key.location=keys/privateKey.pem
