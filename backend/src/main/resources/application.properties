# Pedalons Backend Configuration

# Application
quarkus.application.name=pedalons-backend

# HTTP Configuration
quarkus.http.port=8080

quarkus.http.limits.max-body-size=100M
quarkus.http.limits.max-form-attribute-size=100M

quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-forwarded=false
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true

quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:8180}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,X-Requested-With
quarkus.http.cors.exposed-headers=Location,X-Total-Count
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# ===========================================
# Database Configuration
# ===========================================
quarkus.datasource.db-kind=postgresql

# Hibernate ORM
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.schema-management.halt-on-error=true

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.locations=db/migration

# ===========================================
# JWT/Auth Configuration
# ===========================================

# JWT Configuration
mp.jwt.verify.issuer=pedalons
smallrye.jwt.new-token.issuer=pedalons

# Auth configuration
pedalons.auth.jwt.expiry-minutes=15
pedalons.auth.refresh-token.expiry-days=30
pedalons.auth.email-verification.expiry-hours=24

# WebAuthn/Passkeys configuration
pedalons.auth.webauthn.challenge-expiry-minutes=5

# Cookie configuration
pedalons.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
pedalons.auth.cookie.same-site=strict

# App settings
pedalons.app-name=Pédalons

# ===========================================
# Bootstrap (creates default Domain + PLATFORM_ADMIN User on startup)
# Idempotent — no-op when the rows already exist or when domain/admin-email are blank.
# ===========================================
pedalons.bootstrap.enabled=${PEDALONS_BOOTSTRAP_ENABLED:true}
pedalons.bootstrap.domain=${PEDALONS_BOOTSTRAP_DOMAIN:localhost}
pedalons.bootstrap.domain-name=${PEDALONS_BOOTSTRAP_DOMAIN_NAME:Pedalons Dev}
pedalons.bootstrap.base-url=${PEDALONS_BOOTSTRAP_BASE_URL:https://localhost:5173}
pedalons.bootstrap.admin-email=${PEDALONS_BOOTSTRAP_ADMIN_EMAIL:gabriel.landais@gmail.com}
pedalons.bootstrap.admin-display-name=${PEDALONS_BOOTSTRAP_ADMIN_DISPLAY_NAME:Gaby Landais}

# Error handling
pedalons.error.log-details=${ERROR_LOG_DETAILS:false}

# Token encryption (base64-encoded 32-byte key)
pedalons.encryption.key=${ENCRYPTION_KEY:}

# Tileserver
tileserver.url=${TILESERVER_URL:http://localhost:18080}

# OpenAPI
quarkus.smallrye-openapi.info-title=Pedalons API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API for Pedalons Cycling Team Management Platform
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.store-schema-directory=../contracts
mp.openapi.extensions.smallrye.operationIdStrategy=METHOD
quarkus.smallrye-openapi.oidc-open-id-connect-url=http://localhost:8180/realms/quarkus/.well-known/openid-configuration
mp.openapi.scan.exclude.packages=org.geolatte.geom

# Logging
quarkus.log.console.enabled=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.level=INFO
quarkus.log.category."fr.pedalons".level=INFO
quarkus.log.category."org.hibernate.SQL".level=WARN
quarkus.log.category."org.hibernate.tool.schema".level=INFO

%dev.quarkus.log.file.enabled=true
%dev.quarkus.log.file.path=target/pedalons-dev.log
%dev.quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
%dev.quarkus.log.file.level=INFO

# Indexing
quarkus.index-dependency.geolatte.group-id=org.geolatte
quarkus.index-dependency.geolatte.artifact-id=geolatte-geom

# ===========================================
# Biketeam → tribly migration (disabled by default)
# ===========================================
# Read-only datasource pointing at the restored biketeam dump (see scripts/biketeam_restore.sh).
# Default URL is intentionally unreachable so connection is only attempted when migration runs.
quarkus.datasource.biketeam.db-kind=postgresql
quarkus.datasource.biketeam.username=${BIKETEAM_DB_USER:pedalons}
quarkus.datasource.biketeam.password=${BIKETEAM_DB_PASSWORD:pedalons_dev_password}
quarkus.datasource.biketeam.jdbc.url=${BIKETEAM_DB_URL:jdbc:postgresql://localhost:5432/biketeam_import_unset}
quarkus.datasource.biketeam.jdbc.max-size=4
# Read-only datasource — do NOT enlist its connections in the JTA transaction. Otherwise
# Narayana refuses to associate a second resource ("Failed to enlist") when a @Transactional
# method has already enlisted the main pedalons datasource.
quarkus.datasource.biketeam.jdbc.transactions=disabled
# Keep this datasource out of /q/health/ready — the default URL is unreachable, so probing it
# would report the whole application DOWN on every deployment that isn't running the migration.
quarkus.datasource.biketeam.health-exclude=true

pedalons.migration.biketeam.enabled=${PEDALONS_MIGRATION_BIKETEAM_ENABLED:false}
pedalons.migration.biketeam.team-id=${PEDALONS_MIGRATION_BIKETEAM_TEAM_ID:n-peloton}
pedalons.migration.biketeam.target-domain=${PEDALONS_MIGRATION_BIKETEAM_TARGET_DOMAIN:pedalons.fr}
# Used only when the target Domain row has to be auto-created (empty DB on first run).
# Both default to values derived from target-domain when left blank.
pedalons.migration.biketeam.target-domain-name=${PEDALONS_MIGRATION_BIKETEAM_TARGET_DOMAIN_NAME:Pédalons}
pedalons.migration.biketeam.target-domain-base-url=${PEDALONS_MIGRATION_BIKETEAM_TARGET_DOMAIN_BASE_URL:https://www.pedalons.fr}
pedalons.migration.biketeam.target-team-slug=${PEDALONS_MIGRATION_BIKETEAM_TARGET_TEAM_SLUG:n-peloton}
# Root of the biketeam data export, set through PEDALONS_MIGRATION_BIKETEAM_DATA_DIR:
# holds gpx/, pub-images/, ride-images/, trip-images/. Left unset here rather than bound to an
# empty default, which SmallRye reads back as null and rejects. Unset skips GPX tracks and images.
# Required — the migration aborts when this is blank.
pedalons.migration.biketeam.admin-email=${PEDALONS_MIGRATION_BIKETEAM_ADMIN_EMAIL:gabriel.landais@gmail.com}
# Biketeam let Strava/Facebook/Google accounts exist without an email, which tribly requires.
# Those users get a placeholder address such as strava_1234@<this domain>; it is unique and stable,
# but not deliverable, and they are left unverified so nothing treats it as a reachable inbox.
pedalons.migration.biketeam.placeholder-email-domain=${PEDALONS_MIGRATION_BIKETEAM_PLACEHOLDER_EMAIL_DOMAIN:pedalons.fr}

# ===========================================
# S3/MinIO Storage Configuration
# ===========================================
quarkus.s3.path-style-access=true
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
storage.bucket=${STORAGE_BUCKET:pedalons}

# ===========================================
# Production profile settings
# All values must be provided via environment variables
# ===========================================

# Database
%prod.quarkus.datasource.username=${POSTGRES_USER}
%prod.quarkus.datasource.password=${POSTGRES_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}

# Storage
%prod.pedalons.data.cache=${DATA_CACHE_PATH}
%prod.quarkus.s3.endpoint-override=${MINIO_ENDPOINT}
%prod.quarkus.s3.aws.credentials.static-provider.access-key-id=${MINIO_ACCESS_KEY}
%prod.quarkus.s3.aws.credentials.static-provider.secret-access-key=${MINIO_SECRET_KEY}

# Services
%prod.quarkus.rest-client.imgproxy.url=${IMGPROXY_URL}
%prod.quarkus.rest-client.valhalla.url=${VALHALLA_URL}

# Auth configuration (production)
%prod.pedalons.auth.cookie.secure=true
%prod.mp.jwt.verify.publickey.location=file:/mnt/keys/publicKey.pem
%prod.smallrye.jwt.sign.key.location=file:/mnt/keys/privateKey.pem

# ===========================================
# Dev services
# ===========================================

# Default Dev Services image. In tests this is overridden by DevServicesImageConfigSource,
# which reads the postgres tag from docker-compose.yml (kept up to date by Dependabot).
quarkus.datasource.devservices.image-name=postgis/postgis:17-3.5-alpine

# ===========================================
# Dev profile settings
# ===========================================

%dev.pedalons.data.cache=/tmp/pedalons-data-cache-dev
%dev.quarkus.rest-client.imgproxy.url=http://localhost:38080
%dev.quarkus.rest-client.valhalla.url=http://localhost:8002
%dev.tileserver.url=http://localhost:18080
%dev.quarkus.live-reload.instrumentation=true

# S3/MinIO (dev)
%dev.quarkus.s3.endpoint-override=http://localhost:9000
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=pedalons
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=pedalons_secret

%dev.quarkus.datasource.username=pedalons
%dev.quarkus.datasource.password=pedalons_dev_password
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/pedalons

%dev.quarkus.hibernate-orm.log.sql=true

# Encryption key (dev - DO NOT USE IN PRODUCTION)
# Generated with: openssl rand -base64 32
%dev.pedalons.encryption.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# Auth (dev)
%dev.pedalons.auth.cookie.secure=false

# Mailer (dev) - Mailhog
%dev.quarkus.mailer.from=noreply@pedalons.local
%dev.quarkus.mailer.host=localhost
%dev.quarkus.mailer.port=1025
%dev.quarkus.mailer.mock=false

# Brevo transactional email (disabled by default, SMTP/Mailhog used instead)
# Template IDs: email-verification-fr=2, email-verification-en=3, otp-fr=4, otp-en=5, password-reset-fr=6, password-reset-en=7
quarkus.rest-client.brevo.url=https://api.brevo.com
pedalons.email.brevo.enabled=false

# to test Brevo emails locally
# %dev.pedalons.email.brevo.enabled=true
# %dev.pedalons.email.brevo.api-key=${BREVO_API_KEY}
# %dev.pedalons.email.brevo.templates.email-verification.fr=2
# %dev.pedalons.email.brevo.templates.email-verification.en=3
# %dev.pedalons.email.brevo.templates.otp.fr=4
# %dev.pedalons.email.brevo.templates.otp.en=5
# %dev.pedalons.email.brevo.templates.password-reset.fr=6
# %dev.pedalons.email.brevo.templates.password-reset.en=7

%prod.pedalons.email.brevo.enabled=true
%prod.pedalons.email.brevo.api-key=${BREVO_API_KEY}
