# Server-rendered texts of the notifications: e-mail, push, team webhook. One block per
# NotificationType; NotificationTextsTest fails if a type is missing a key.
#
# Placeholders: {actor} {team} {subject} {date} {excerpt} {site}, and {changes} for RIDE_UPDATED.
# {actor} falls back to {team} when nobody in particular caused the event. Plain text: the e-mail
# template escapes what it inserts. Read as UTF-8.

RIDE_PUBLISHED.subject=Nouvelle sortie : {subject}
RIDE_PUBLISHED.title=Nouvelle sortie dans {team}
RIDE_PUBLISHED.body={actor} a publié la sortie « {subject} », prévue le {date}.
RIDE_PUBLISHED.cta=Voir la sortie

RIDE_CANCELLED.subject=Sortie annulée : {subject}
RIDE_CANCELLED.title=Sortie annulée
RIDE_CANCELLED.body=La sortie « {subject} » du {date}, à laquelle vous étiez inscrit, est annulée.
RIDE_CANCELLED.cta=Voir la sortie

TRIP_PUBLISHED.subject=Nouveau voyage : {subject}
TRIP_PUBLISHED.title=Nouveau voyage dans {team}
TRIP_PUBLISHED.body={actor} a publié le voyage « {subject} », qui commence le {date}.
TRIP_PUBLISHED.cta=Voir le voyage

TRIP_CANCELLED.subject=Voyage annulé : {subject}
TRIP_CANCELLED.title=Voyage annulé
TRIP_CANCELLED.body=Le voyage « {subject} » du {date}, auquel vous étiez inscrit, est annulé.
TRIP_CANCELLED.cta=Voir le voyage

POST_PUBLISHED.subject=Nouvel article : {subject}
POST_PUBLISHED.title=Nouvel article dans {team}
POST_PUBLISHED.body={actor} a publié « {subject} ».
POST_PUBLISHED.cta=Lire l'article

COMMENT_REPLY.subject={actor} vous a répondu
COMMENT_REPLY.title=Nouvelle réponse
COMMENT_REPLY.body={actor} a répondu à votre commentaire sur « {subject} » : « {excerpt} »
COMMENT_REPLY.cta=Voir la discussion

RIDE_REMINDER.subject=C'est demain : {subject}
RIDE_REMINDER.title=Rappel : sortie demain
RIDE_REMINDER.body=La sortie « {subject} », à laquelle vous êtes inscrit, part le {date}.
RIDE_REMINDER.cta=Voir la sortie

RIDE_UPDATED.subject=Sortie modifiée : {subject}
RIDE_UPDATED.title=Sortie modifiée
RIDE_UPDATED.body=La sortie « {subject} », à laquelle vous êtes inscrit, a changé : {changes}.
RIDE_UPDATED.cta=Voir la sortie

RIDE_JOINED.subject={actor} s'est inscrit à {subject}
RIDE_JOINED.title=Nouvel inscrit
RIDE_JOINED.body={actor} s'est inscrit au groupe « {excerpt} » de la sortie « {subject} » du {date}.
RIDE_JOINED.cta=Voir la sortie

COMMENT_ON_MY_PUBLICATION.subject={actor} a commenté « {subject} »
COMMENT_ON_MY_PUBLICATION.title=Nouveau commentaire
COMMENT_ON_MY_PUBLICATION.body={actor} a commenté « {subject} » : « {excerpt} »
COMMENT_ON_MY_PUBLICATION.cta=Voir la discussion

TEAM_INVITATION.subject={actor} vous invite dans {team}
TEAM_INVITATION.title=Invitation dans {team}
TEAM_INVITATION.body={actor} vous invite à rejoindre l'équipe {team} sur {site}.
TEAM_INVITATION.cta=Voir l'invitation

# The clauses of RIDE_UPDATED's {changes}, one per NotificationChange, joined by change.separator.
change.separator= ; 
change.DATE_TIME=elle aura lieu le {date}
change.START_PLACE=le point de départ n'est plus le même

# The frame of the daily digest e-mail. {count} is the number of notifications it holds.
digest.subject=Votre résumé : {count} notification(s)
digest.title=Ce que vous avez manqué
digest.intro=Voici les notifications de ces dernières 24 heures.

# The message a team administrator sends to check the team webhook.
webhook.test.title=Webhook {team} branché
webhook.test.body=Les annonces de l'équipe {team} sur {site} arriveront ici : sorties, voyages et articles publiés, annulations et modifications.
