# See texts_fr.properties for the placeholders and the rules.

RIDE_PUBLISHED.subject=New ride: {subject}
RIDE_PUBLISHED.title=New ride in {team}
RIDE_PUBLISHED.body={actor} published the ride "{subject}", on {date}.
RIDE_PUBLISHED.cta=View the ride

RIDE_CANCELLED.subject=Ride cancelled: {subject}
RIDE_CANCELLED.title=Ride cancelled
RIDE_CANCELLED.body=The ride "{subject}" on {date}, which you had joined, is cancelled.
RIDE_CANCELLED.cta=View the ride

TRIP_PUBLISHED.subject=New trip: {subject}
TRIP_PUBLISHED.title=New trip in {team}
TRIP_PUBLISHED.body={actor} published the trip "{subject}", starting on {date}.
TRIP_PUBLISHED.cta=View the trip

TRIP_CANCELLED.subject=Trip cancelled: {subject}
TRIP_CANCELLED.title=Trip cancelled
TRIP_CANCELLED.body=The trip "{subject}" on {date}, which you had joined, is cancelled.
TRIP_CANCELLED.cta=View the trip

POST_PUBLISHED.subject=New post: {subject}
POST_PUBLISHED.title=New post in {team}
POST_PUBLISHED.body={actor} published "{subject}".
POST_PUBLISHED.cta=Read the post

COMMENT_REPLY.subject={actor} replied to you
COMMENT_REPLY.title=New reply
COMMENT_REPLY.body={actor} replied to your comment on "{subject}": "{excerpt}"
COMMENT_REPLY.cta=View the conversation

RIDE_REMINDER.subject=Tomorrow: {subject}
RIDE_REMINDER.title=Reminder: ride tomorrow
RIDE_REMINDER.body=The ride "{subject}", which you are registered for, starts on {date}.
RIDE_REMINDER.cta=View the ride

RIDE_UPDATED.subject=Ride changed: {subject}
RIDE_UPDATED.title=Ride changed
RIDE_UPDATED.body=The ride "{subject}", which you are registered for, has changed: {changes}.
RIDE_UPDATED.cta=View the ride

RIDE_JOINED.subject={actor} joined {subject}
RIDE_JOINED.title=New rider
RIDE_JOINED.body={actor} joined the "{excerpt}" group of the ride "{subject}" on {date}.
RIDE_JOINED.cta=View the ride

COMMENT_ON_MY_PUBLICATION.subject={actor} commented on "{subject}"
COMMENT_ON_MY_PUBLICATION.title=New comment
COMMENT_ON_MY_PUBLICATION.body={actor} commented on "{subject}": "{excerpt}"
COMMENT_ON_MY_PUBLICATION.cta=View the discussion

TEAM_INVITATION.subject={actor} invited you to {team}
TEAM_INVITATION.title=Invitation to {team}
TEAM_INVITATION.body={actor} invited you to join the team {team} on {site}.
TEAM_INVITATION.cta=View the invitation

# The clauses of RIDE_UPDATED's {changes}, one per NotificationChange, joined by change.separator.
change.separator=; 
change.DATE_TIME=it now takes place on {date}
change.START_PLACE=the meeting point has moved

# The frame of the daily digest e-mail. {count} is the number of notifications it holds.
digest.subject=Your digest: {count} notification(s)
digest.title=What you missed
digest.intro=Here are the notifications of the last 24 hours.

# The message a team administrator sends to check the team webhook.
webhook.test.title={team} webhook connected
webhook.test.body=Announcements of the team {team} on {site} will be posted here: published rides, trips and posts, cancellations and changes.
