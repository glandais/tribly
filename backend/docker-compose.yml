services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    platform: linux/x86_64
    container_name: tribly-dev-postgres
    restart: unless-stopped
    networks:
      - tribly-dev
    environment:
      POSTGRES_USER: tribly
      POSTGRES_PASSWORD: tribly_dev_password
      POSTGRES_DB: tribly
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tribly"]
      interval: 10s
      timeout: 5s
      retries: 5

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v3.30.1
    container_name: tribly-dev-imgproxy
    restart: unless-stopped
    networks:
      - tribly-dev
    volumes:
      - "../data/storage:/mnt/storage:ro"
    environment:
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AUTO_AVIF: "true"
      IMGPROXY_AUTO_JXL: "true"
      IMGPROXY_QUALITY: "85"
      IMGPROXY_MAX_SRC_RESOLUTION: "50000000"
      IMGPROXY_MAX_ANIMATION_FRAMES: "100"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: "/mnt/storage"
      IMGPROXY_USE_ETAG: "true"
    ports:
      - "127.0.0.1:38080:8080"

  brouter:
    build: ../services/brouter
    container_name: tribly-dev-brouter
    restart: unless-stopped
    networks:
      - tribly-dev
    ports:
      - "127.0.0.1:17777:17777"
    volumes:
      - ../data/segments4:/segments4:ro
    environment:
      BROUTER_THREADS: "8"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: tribly-dev-mailhog
    restart: unless-stopped
    networks:
      - tribly-dev
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI

networks:
  tribly-dev:
