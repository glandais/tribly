services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    platform: linux/x86_64
    container_name: pedalons-dev-postgres
    restart: unless-stopped
    networks:
      - pedalons-dev
    environment:
      POSTGRES_USER: pedalons
      POSTGRES_PASSWORD: pedalons_dev_password
      POSTGRES_DB: pedalons
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedalons"]
      interval: 10s
      timeout: 5s
      retries: 5

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v3.31.1
    container_name: pedalons-dev-imgproxy
    restart: unless-stopped
    networks:
      - pedalons-dev
    depends_on:
      - minio
    environment:
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AUTO_AVIF: "true"
      IMGPROXY_AUTO_JXL: "true"
      IMGPROXY_QUALITY: "85"
      IMGPROXY_MAX_SRC_RESOLUTION: "50000000"
      IMGPROXY_MAX_ANIMATION_FRAMES: "100"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_USE_S3: "true"
      AWS_ACCESS_KEY_ID: pedalons
      AWS_SECRET_ACCESS_KEY: pedalons_secret
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1
    ports:
      - "127.0.0.1:38080:8080"

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: pedalons-dev-valhalla
    restart: unless-stopped
    networks:
      - pedalons-dev
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ../data/valhalla:/custom_files
    environment:
      tile_urls: ${VALHALLA_TILE_URLS:-http://download.geofabrik.de/europe/france-latest.osm.pbf}
      build_elevation: "True"
      build_admins: "True"
      build_time_zones: "True"
      server_threads: "4"
      serve_tiles: "True"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: pedalons-dev-mailhog
    restart: unless-stopped
    networks:
      - pedalons-dev
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: pedalons-dev-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - pedalons-dev
    environment:
      MINIO_ROOT_USER: pedalons
      MINIO_ROOT_PASSWORD: pedalons_secret
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Console UI
    volumes:
      - minio_data:/data

  tileserver:
    image: maptiler/tileserver-gl:v5.5.0
    container_name: pedalons-dev-tileserver
    restart: unless-stopped
    networks:
      - pedalons-dev
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ../data/tileserver:/data

volumes:
  minio_data:

networks:
  pedalons-dev:
