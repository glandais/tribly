services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    platform: linux/x86_64
    container_name: tribly-dev-postgres
    restart: unless-stopped
    networks:
      - tribly-dev
    environment:
      POSTGRES_USER: tribly
      POSTGRES_PASSWORD: tribly_dev_password
      POSTGRES_DB: tribly
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tribly"]
      interval: 10s
      timeout: 5s
      retries: 5

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v3.31.1
    container_name: tribly-dev-imgproxy
    restart: unless-stopped
    networks:
      - tribly-dev
    depends_on:
      - minio
    environment:
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AUTO_AVIF: "true"
      IMGPROXY_AUTO_JXL: "true"
      IMGPROXY_QUALITY: "85"
      IMGPROXY_MAX_SRC_RESOLUTION: "50000000"
      IMGPROXY_MAX_ANIMATION_FRAMES: "100"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_USE_S3: "true"
      AWS_ACCESS_KEY_ID: tribly
      AWS_SECRET_ACCESS_KEY: tribly_secret
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1
    ports:
      - "127.0.0.1:38080:8080"

  brouter:
    build: ../services/brouter
    container_name: tribly-dev-brouter
    restart: unless-stopped
    networks:
      - tribly-dev
    ports:
      - "127.0.0.1:17777:17777"
    volumes:
      - ../data/segments4:/opt/brouter/segments4:ro
    environment:
      BROUTER_THREADS: "8"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: tribly-dev-mailhog
    restart: unless-stopped
    networks:
      - tribly-dev
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: tribly-dev-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - tribly-dev
    environment:
      MINIO_ROOT_USER: tribly
      MINIO_ROOT_PASSWORD: tribly_secret
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Console UI
    volumes:
      - minio_data:/data

  tileserver:
    image: maptiler/tileserver-gl:v5.5.0
    container_name: tribly-dev-tileserver
    restart: unless-stopped
    networks:
      - tribly-dev
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ../data/tileserver:/data

volumes:
  minio_data:

networks:
  tribly-dev:
