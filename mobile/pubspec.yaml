name: pedalons
description: "Tribly mobile app - cycling team platform"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Routing
  go_router: ^14.2.0

  # HTTP client
  dio: ^5.9.0
  retrofit: ^4.9.0

  # JSON serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0


  # WebAuthn/Passkeys
  passkeys: ^2.1.0
  passkeys_platform_interface: ^2.6.0

  # Secure storage
  flutter_secure_storage: ^9.2.0

  # Deep links
  app_links: ^6.0.0

  # Internationalization
  easy_localization: ^3.0.5

  # UI utilities
  flutter_hooks: ^0.21.0
  hooks_riverpod: ^3.0.0

  # Image caching with auth headers support
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.10.0
  freezed: ^3.1.0
  json_serializable: ^6.11.0
  riverpod_generator: ^3.0.0
  retrofit_generator: ^10.1.0
  openapi_retrofit_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
