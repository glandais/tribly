name: pedalons
description: "Pédalons mobile app - cycling team platform"
publish_to: 'none'
version: 1.0.0+45

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.2

  # Routing
  go_router: ^18.0.0

  # HTTP client
  dio: ^5.11.0
  retrofit: ^4.10.0

  # JSON serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0


  # WebAuthn/Passkeys
  passkeys: ^2.22.3
  passkeys_platform_interface: ^2.6.0

  # Secure storage
  flutter_secure_storage: ^11.0.0

  # Deep links
  app_links: ^7.2.1

  # Internationalization
  easy_localization: ^3.0.5
  # Direct dependency: AppFormatters uses NumberFormat/DateFormat. It also comes in
  # transitively through easy_localization/flutter_localizations — relying on that is a
  # breakage waiting for the next version bump.
  intl: ^0.20.3

  # Image caching with auth headers support
  cached_network_image: ^3.4.1

  # Maps
  maplibre: ^0.3.6

  # Full-screen image viewer
  photo_view: ^0.15.0

  # Scrolling helpers (agenda jump-to-day, stage rail centering)
  scrollable_positioned_list: ^0.3.8
  scroll_to_index: ^3.0.1

  # External links (markdown links, webcal://, mailto:, tel:)
  url_launcher: ^6.3.1

  # Local mirror of UI preferences (theme, locale, units, map style, list density)
  shared_preferences: ^2.3.0

  # Avatar upload (POST /api/users/me/avatar)
  image_picker: ^1.1.2

  # Coarse location for the "around me" proximity filter
  geolocator: ^14.0.3

  # Share files (for route downloads)
  share_plus: ^13.3.0
  path_provider: ^2.1.6

  # Markdown rendering
  markdown_widget: ^2.3.2+6

  # Fonts
  google_fonts: ^8.2.1
  package_info_plus: ^10.2.1
  flutter_driver:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

  # Code generation
  build_runner: ^2.16.0
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.9
  openapi_retrofit_generator: ^2.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
    - assets/icon.png
    - privacy/
