name: pedalons
description: "Pédalons mobile app - cycling team platform"
publish_to: 'none'
version: 1.0.0+14

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.0
  riverpod_annotation: ^4.0.0

  # Routing
  go_router: ^17.3.0

  # HTTP client
  dio: ^5.9.1
  retrofit: ^4.9.0

  # JSON serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0


  # WebAuthn/Passkeys
  passkeys: ^2.19.0
  passkeys_platform_interface: ^2.6.0

  # Secure storage
  flutter_secure_storage: ^10.3.1

  # Deep links
  app_links: ^7.1.1

  # Internationalization
  easy_localization: ^3.0.5

  # UI utilities
  hooks_riverpod: ^3.3.0

  # Image caching with auth headers support
  cached_network_image: ^3.4.1

  # Maps
  maplibre: ^0.3.5

  # Share files (for route downloads)
  share_plus: ^12.0.1
  path_provider: ^2.1.0

  # Markdown rendering
  markdown_widget: ^2.3.2+6

  # Fonts
  google_fonts: ^8.1.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

  # Code generation
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.0
  retrofit_generator: ^10.2.6
  openapi_retrofit_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
    - assets/icon.png
    - privacy/
