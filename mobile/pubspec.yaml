name: pedalons
description: "Tribly mobile app - cycling team platform"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^17.1.0

  # HTTP client
  dio: ^5.9.2
  retrofit: ^4.9.0

  # JSON serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0


  # WebAuthn/Passkeys
  passkeys: ^2.1.0
  passkeys_platform_interface: ^2.6.0

  # Secure storage
  flutter_secure_storage: ^10.0.0

  # Deep links
  app_links: ^7.0.0

  # Internationalization
  easy_localization: ^3.0.5

  # UI utilities
  flutter_hooks: ^0.21.0
  hooks_riverpod: ^3.3.1

  # Image caching with auth headers support
  cached_network_image: ^3.4.1

  # Maps
  maplibre: ^0.3.4+1

  # Share files (for route downloads)
  share_plus: ^12.0.1
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.12.2
  freezed: ^3.2.5
  json_serializable: ^6.11.4
  riverpod_generator: ^4.0.3
  retrofit_generator: ^10.1.0
  openapi_retrofit_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
