# Loki of the monitoring stack: one process, chunks and index on its volume.
#
# Retention is 14 days, like the Caddy access log it receives: the privacy policy promises that
# log is deleted after 14 days (docs/OPERATIONS.md, « Access logs »), and a copy kept longer here
# would break the promise. Don't raise it.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-09-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 64

# Alerts on log lines, sent to the same Alertmanager. Rules in rules/fake/ — `fake` is the tenant
# Loki uses when auth is off.
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory

analytics:
  reporting_enabled: false
